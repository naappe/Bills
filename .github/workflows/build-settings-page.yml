name: Build Settings preferences page
on:
  push:
    paths:
      - '.github/workflows/build-settings-page.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch master Settings page
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace("reportFrom:'',reportTo:''};", "reportFrom:'',reportTo:'',role:'user'};")
          marker="\nfunction fail(title,e,fn)"
          block=r'''

const PREF_KEY='ws_erp_preferences';
function getPrefs(){try{return{theme:'system',density:'comfortable',pageSize:20,...JSON.parse(localStorage.getItem(PREF_KEY)||'{}')}}catch{return{theme:'system',density:'comfortable',pageSize:20}}}
function applyPrefs(){const p=getPrefs();document.documentElement.dataset.theme=p.theme;document.documentElement.dataset.density=p.density;document.documentElement.style.colorScheme=p.theme==='system'?'light dark':p.theme;state.invPageSize=Number(p.pageSize)||20;state.costPageSize=Number(p.pageSize)||20}
function savePrefs(next){localStorage.setItem(PREF_KEY,JSON.stringify({...getPrefs(),...next}));applyPrefs()}
async function settings(){const prefs=getPrefs(),u=state.session?.user,email=u?.email||'Signed in user',created=u?.created_at?new Date(u.created_at).toLocaleString():'—',last=u?.last_sign_in_at?new Date(u.last_sign_in_at).toLocaleString():'—',expires=state.session?.expires_at?new Date(state.session.expires_at*1000).toLocaleString():'—';$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Settings</h1><p>Local display preferences and read-only account information.</p></div></header><section class="kpi-grid"><article class="card kpi-card"><span>Signed-in user</span><strong>${esc(email)}</strong></article><article class="card kpi-card"><span>Active role</span><strong>${esc(String(state.role||'user').toUpperCase())}</strong></article><article class="card kpi-card"><span>Session status</span><strong>${state.session?'Active':'Inactive'}</strong></article><article class="card kpi-card"><span>Application version</span><strong>2.0.0</strong></article></section><section class="card"><header class="card-header"><div><h2>Display preferences</h2><p>Saved only in this browser.</p></div></header><div class="card-body"><section class="toolbar"><label class="field"><span>Theme</span><select id="settingTheme"><option value="system" ${prefs.theme==='system'?'selected':''}>System</option><option value="light" ${prefs.theme==='light'?'selected':''}>Light</option><option value="dark" ${prefs.theme==='dark'?'selected':''}>Dark</option></select></label><label class="field"><span>Table density</span><select id="settingDensity"><option value="comfortable" ${prefs.density==='comfortable'?'selected':''}>Comfortable</option><option value="compact" ${prefs.density==='compact'?'selected':''}>Compact</option></select></label><label class="field"><span>Default page size</span><select id="settingPageSize"><option value="20" ${Number(prefs.pageSize)===20?'selected':''}>20 rows</option><option value="50" ${Number(prefs.pageSize)===50?'selected':''}>50 rows</option><option value="100" ${Number(prefs.pageSize)===100?'selected':''}>100 rows</option></select></label><button class="btn btn-primary" id="saveSettings">Save preferences</button><button class="btn btn-secondary" id="openDeveloperSettings">Open Developer Mode</button><button class="btn btn-secondary" id="resetSettings">Reset local preferences</button></section><div class="alert alert-success" id="settingsSaved" hidden>Preferences saved in this browser.</div></div></section><section class="card"><header class="card-header"><div><h2>Account and system information</h2><p>Read-only values from the current authenticated session.</p></div></header><div class="card-body"><dl class="detail-grid">${[['User ID',u?.id||'—'],['Email',email],['Role',String(state.role||'user').toUpperCase()],['Email confirmed',u?.email_confirmed_at?'Yes':'No'],['Account created',created],['Last sign-in',last],['Session expires',expires],['Authentication','Supabase Auth'],['Data protection','Row Level Security'],['Application','Static GitHub Pages SPA']].map(([l,v])=>`<div><dt>${esc(l)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl></div></section></section>`;$('#saveSettings').onclick=()=>{savePrefs({theme:$('#settingTheme').value,density:$('#settingDensity').value,pageSize:Number($('#settingPageSize').value)});$('#settingsSaved').hidden=false};$('#openDeveloperSettings').onclick=()=>dev(true);$('#resetSettings').onclick=()=>{localStorage.removeItem(PREF_KEY);applyPrefs();settings()}}
'''
          if marker not in s: raise SystemExit('settings insertion marker missing')
          s=s.replace(marker,block+marker,1)
          old="else if(v==='reports')await reports();else $('#content')"
          new="else if(v==='reports')await reports();else if(v==='settings')await settings();else $('#content')"
          if old not in s: raise SystemExit('route marker missing')
          s=s.replace(old,new,1)
          old="$('#accountRole').textContent=(data?.role||'user').toUpperCase();nav();"
          new="state.role=data?.role||'user';$('#accountRole').textContent=state.role.toUpperCase();applyPrefs();nav();"
          if old not in s: raise SystemExit('role marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          css=Path('app/css/master.css')
          c=css.read_text()
          addon='''\n/* Settings preferences */\n:root[data-density="compact"] table th,:root[data-density="compact"] table td{padding-top:8px;padding-bottom:8px}\n:root[data-theme="dark"] body{background:#0f1720;color:#e5edf5}\n:root[data-theme="dark"] .master-app,:root[data-theme="dark"] .master-main,:root[data-theme="dark"] .master-content{background:#0f1720;color:#e5edf5}\n:root[data-theme="dark"] .card,:root[data-theme="dark"] .toolbar,:root[data-theme="dark"] .modal-dialog,:root[data-theme="dark"] .master-mobilebar{background:#17212b;color:#e5edf5;border-color:#344454}\n:root[data-theme="dark"] input,:root[data-theme="dark"] select{background:#111b24;color:#e5edf5;border-color:#445566}\n:root[data-theme="dark"] table th{background:#1b2733;color:#dce7f1}\n:root[data-theme="dark"] table td{border-color:#344454}\n:root[data-theme="dark"] .card-header p,:root[data-theme="dark"] .page-header p,:root[data-theme="dark"] small,:root[data-theme="dark"] dt{color:#aebdca}\n'''
          if '/* Settings preferences */' not in c: css.write_text(c+addon)
          PY
      - name: Commit Settings and remove temporary workflow
        run: |
          git config user.name "ChatGPT"
          git config user.email "actions@github.com"
          rm .github/workflows/build-settings-page.yml
          git add index.html app/css/master.css .github/workflows/build-settings-page.yml
          git commit -m "Build Settings preferences page"
          git push
# trigger existing workflow
