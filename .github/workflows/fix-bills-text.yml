name: Fix Bills text hierarchy

'on':
  push:
    paths:
      - .github/workflows/fix-bills-text.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply Bills typography repair
        shell: bash
        run: |
          marker='/* ===== Bills page text hierarchy repair — 2026-07-26 ===== */'
          if ! grep -Fq "$marker" assets/css/breathing-room.css; then
            printf '\n' >> assets/css/breathing-room.css
            echo '' | base64 --decode >> assets/css/breathing-room.css
          fi
          sed -i 's/assets\/css\/breathing-room.css?v=3/assets\/css\/breathing-room.css?v=4/' index.html
          rm .github/workflows/fix-bills-text.yml

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/breathing-room.css index.html .github/workflows/fix-bills-text.yml
          git diff --cached --quiet || git commit -m "Repair Bills page text hierarchy and readability"
          git push
