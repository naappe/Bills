name: Verify Bills stability

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bills-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax, architecture and save contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run repository verification
        run: node tools/verify.mjs

      - name: Publish verification summary
        if: always()
        run: |
          echo "## Bills stability gate" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow checks JavaScript syntax, application versions, Bill Entry DOM contracts, controller ownership, save wiring, Supabase error propagation, and schema compatibility." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "A failed check must be fixed before deployment." >> "$GITHUB_STEP_SUMMARY"