name: Fix Bills responsive width

'on':
  push:
    paths:
      - .github/workflows/fix-bills-width.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply responsive Bills repair
        shell: bash
        run: |
          marker='/* ===== Bills responsive width repair — 2026-07-26 ===== */'
          if ! grep -Fq "$marker" assets/css/breathing-room.css; then
            printf '\n' >> assets/css/breathing-room.css
            echo '' | base64 --decode >> assets/css/breathing-room.css
          fi
          sed -i 's/assets\/css\/breathing-room.css?v=4/assets\/css\/breathing-room.css?v=5/' index.html
          rm .github/workflows/fix-bills-width.yml

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/breathing-room.css index.html .github/workflows/fix-bills-width.yml
          git diff --cached --quiet || git commit -m "Fix Bills responsive width and clipped actions"
          git push
