<!doctype html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Inventory · White Saffron ERP</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap"><link rel="stylesheet" href="./app/css/master.css?v=7.1.0"><link rel="stylesheet" href="./app/css/brand-ui.css?v=7.1.0"><style>.inventory-grid{display:grid;gap:18px}.toolbar{display:grid;grid-template-columns:1fr 220px 180px;gap:10px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.summary-card{padding:18px}.summary-card span{display:block;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.summary-card strong{display:block;margin-top:8px;font:700 26px/1.1 "Playfair Display",serif}.numeric{text-align:right}@media(max-width:820px){.toolbar,.summary-grid{grid-template-columns:1fr 1fr}.toolbar label:first-child{grid-column:1/-1}}@media(max-width:520px){.toolbar,.summary-grid{grid-template-columns:1fr}}</style></head><body>
<section class="auth-screen" id="auth"><form class="login-card" id="login"><div class="master-mark login-mark">WS</div><div><h1>White Saffron ERP</h1><p>Sign in to manage inventory.</p></div><label class="field"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Password</span><input id="password" type="password" required></label><button class="btn btn-primary" id="loginButton">Sign in</button><div class="alert alert-error" id="err" hidden></div></form></section>
<section class="master-app" id="app" hidden><header class="master-header"><div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div><nav class="master-nav" id="desktopNav"></nav><div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="user"></small></div><button class="icon-button" id="logout"></button></div></header><header class="mobile-top"><button id="openMenu"></button><strong>Inventory</strong><a class="btn btn-primary" href="./bills-live.html">New Bill</a></header><aside class="mobile-drawer" id="drawer"><div class="drawer-head"><div class="master-brand"><div class="master-mark">WS</div><strong>Menu</strong></div><button id="closeMenu">×</button></div><nav class="drawer-links" id="drawerNav"></nav></aside><button class="mobile-backdrop" id="backdrop"></button><main class="master-main"><div class="master-content" id="content"></div></main><nav class="mobile-bottom" id="bottomNav"></nav></section>
<script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{wireMasterShell,setAccount}from'./app/js/master-shell.js?v=7.1.0';import{normalizeUnit,CANONICAL_UNITS}from'./app/js/units.js?v=1.0.0';const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'white-saffron-erp-auth'}});const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c])),num=v=>Number(v)||0,money=v=>`MVR ${num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;let role='viewer',rows=[];function showLogin(){$('#app').hidden=true;$('#auth').hidden=false}function render(){const live=rows.filter(x=>x.stock_tracking_active),low=live.filter(x=>num(x.stock??x.current_stock)<=num(x.minimum_stock)),categories=new Set(rows.map(x=>x.category||x.Category).filter(Boolean));$('#content').innerHTML=`<section class="inventory-grid"><header class="dashboard-hero"><div><div class="hero-kicker">01 Inventory master</div><h1>Inventory</h1><p>Manage the live product list, units, stock levels and latest purchase prices.</p></div></header><section class="summary-grid"><article class="card summary-card"><span>Active items</span><strong>${rows.length}</strong></article><article class="card summary-card"><span>Live stock</span><strong>${live.length}</strong></article><article class="card summary-card"><span>Low stock</span><strong>${low.length}</strong></article><article class="card summary-card"><span>Categories</span><strong>${categories.size}</strong></article></section><section class="card toolbar"><label class="field"><span>Search</span><input id="q" placeholder="Search item or category"></label><label class="field"><span>Unit</span><select id="unit"><option value="">All units</option>${CANONICAL_UNITS.map(u=>`<option>${u}</option>`).join('')}</select></label><label class="field"><span>Status</span><select id="status"><option value="">All</option><option value="live">Live</option><option value="low">Low stock</option></select></label></section><section class="card"><div class="table-wrapper"><table><thead><tr><th>Item</th><th>Category</th><th>Unit</th><th class="numeric">Current stock</th><th class="numeric">Minimum</th><th>Latest vendor</th><th class="numeric">Latest price</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></section>`;['q','unit','status'].forEach(id=>$(`#${id}`).oninput=draw);draw()}function draw(){const q=($('#q').value||'').toLowerCase(),u=$('#unit').value,s=$('#status').value;const filtered=rows.filter(x=>{const name=String(x.Name||x.name||x.item_name||''),cat=String(x.category||x.Category||''),unit=normalizeUnit(x.Unit||x.unit),stock=num(x.stock??x.current_stock),min=num(x.minimum_stock),isLive=!!x.stock_tracking_active,isLow=isLive&&stock<=min;return(!q||`${name} ${cat}`.toLowerCase().includes(q))&&(!u||unit===u)&&(!s||(s==='live'&&isLive)||(s==='low'&&isLow))});$('#rows').innerHTML=filtered.length?filtered.map(x=>{const stock=num(x.stock??x.current_stock),min=num(x.minimum_stock),isLive=!!x.stock_tracking_active,isLow=isLive&&stock<=min;return`<tr><td><strong>${esc(x.Name||x.name||x.item_name||'Unnamed item')}</strong></td><td>${esc(x.category||x.Category||'—')}</td><td>${normalizeUnit(x.Unit||x.unit)}</td><td class="numeric">${stock}</td><td class="numeric">${min}</td><td>${esc(x.latest_vendor||x.vendor_name||'—')}</td><td class="numeric">${money(x.latest_price||x.Rate||x.rate)}</td><td><span class="badge ${isLow?'badge-warning':isLive?'badge-success':'badge-info'}">${isLow?'Low':isLive?'Live':'Pending'}</span></td></tr>`}).join(''):'<tr><td colspan="8" class="empty-row">No inventory items found.</td></tr>'}async function show(session){$('#auth').hidden=true;$('#app').hidden=false;const r=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();role=String(r.data?.role||'viewer').toLowerCase();setAccount({role,email:session.user.email||''});wireMasterShell({active:'Inventory',role,logout:async()=>{await sb.auth.signOut();showLogin()}});const result=await sb.from('supply').select('*').eq('is_active',true).order('Name');if(result.error)throw result.error;rows=result.data||[];render()}$('#login').onsubmit=async e=>{e.preventDefault();const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#err').textContent=error.message;$('#err').hidden=false}else await show(data.session)};const{data:{session}}=await sb.auth.getSession();if(session)await show(session);else showLogin();sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT')showLogin();if(event==='SIGNED_IN'&&session)await show(session)});</script></body></html>
