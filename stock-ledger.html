<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Stock Control | White Saffron ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app/css/master.css?v=7.1.0"><link rel="stylesheet" href="./app/css/brand-ui.css?v=7.1.0">
<style>
:root{--navy:#131f38;--blue:#3069b3;--gold:#c9954e;--bg:#f7f8fa;--line:#e4e7ec;--green:#027a48;--amber:#b54708;--red:#b42318}body{background:var(--bg);font-family:Inter,Arial,sans-serif}.master-header{background:#fff;border-color:var(--line)}.master-mark,.master-brand-copy strong,h1,h2{font-family:Inter,Arial,sans-serif;color:var(--navy)}.master-nav a.active{background:#eef4fc;color:var(--blue)}.master-nav a.active:after{background:var(--blue)}.stock-page{display:grid;gap:20px}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.hero h1{margin:5px 0 0;font-size:29px;letter-spacing:-.035em}.hero p{margin:7px 0 0;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions .btn-primary{background:var(--navy)}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi{padding:18px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgb(0 0 0 / .04)}.kpi header{display:flex;justify-content:space-between}.kpi span{color:#667085;font-size:11px;font-weight:700}.kpi i{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:#eef4fc;color:var(--blue);font-style:normal;font-weight:800}.kpi:nth-child(2) i{background:#fff7e6;color:#e2911a}.kpi:nth-child(3) i{background:#fef2f2;color:#dc2626}.kpi:nth-child(4) i{background:#ecfdf3;color:#2d9e55}.kpi strong{display:block;margin-top:13px;color:var(--navy);font-size:26px;letter-spacing:-.035em}.kpi small{display:block;margin-top:4px;color:#98a2b3;font-size:11px}.stock-card{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 3px rgb(0 0 0 / .04)}.toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 150px 150px auto;align-items:end;gap:12px;padding:17px;border-bottom:1px solid var(--line)}.toolbar input,.toolbar select{border-color:#d0d5dd;background:#fff}.toolbar .btn{min-height:42px;border-color:#d0d5dd}.section-head{display:flex;justify-content:space-between;gap:12px;padding:17px 18px;border-bottom:1px solid var(--line)}.section-head h2{margin:0;font-size:15px}.section-head p{margin:3px 0 0;font-size:12px}.stock-table th{background:#f9fafb;color:#667085}.stock-table th,.stock-table td{padding:14px 16px;border-color:var(--line)}.item{display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:#f2f4f7;color:var(--navy);font-size:12px;font-weight:800}.item small{display:block;margin-top:2px;color:#98a2b3;font-size:11px}.qty{font-variant-numeric:tabular-nums;font-weight:700}.state{min-height:23px;padding:3px 8px;border-radius:999px;font-size:10px;font-weight:800}.healthy{background:#ecfdf3;color:var(--green)}.low{background:#fffaeb;color:var(--amber)}.out{background:#fef3f2;color:var(--red)}.empty{padding:42px!important;text-align:center;color:#98a2b3}.recent{display:grid;grid-template-columns:repeat(3,1fr)}.recent article{padding:16px;border-right:1px solid var(--line)}.recent article:last-child{border:0}.recent small{display:block;color:#98a2b3;font-size:11px}.recent strong{display:block;margin:5px 0;color:var(--navy);font-size:13px}.recent span{font-size:11px;color:#667085}.form-note{margin:0 0 16px;color:#667085;font-size:12px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}@media(max-width:860px){.hero{align-items:flex-start;flex-direction:column}.kpis{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr}.recent{grid-template-columns:1fr}.recent article{border-right:0;border-bottom:1px solid var(--line)}}@media(max-width:520px){.kpis,.toolbar{grid-template-columns:1fr}.master-content{padding:20px 14px 90px}.actions{width:100%}.actions .btn{flex:1}.stock-table th:nth-child(2),.stock-table td:nth-child(2),.stock-table th:nth-child(7),.stock-table td:nth-child(7){display:none}}
</style></head><body>
<section class="auth-screen" id="auth"><form class="login-card" id="login"><div class="master-mark login-mark">WS</div><div><h1>White Saffron ERP</h1><p>Sign in to manage stock control.</p></div><label class="field"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Password</span><input id="password" type="password" required></label><button class="btn btn-primary">Sign in</button><div class="alert alert-error" id="err" hidden></div></form></section>
<section class="master-app" id="app" hidden><header class="master-header"><div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div><nav class="master-nav" id="desktopNav"></nav><div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="user"></small></div><button class="icon-button" id="logout"></button></div></header><header class="mobile-top"><button id="openMenu"></button><strong>Stock Control</strong><button class="btn btn-primary" id="mobileMove" hidden>Record</button></header><aside class="mobile-drawer" id="drawer"><div class="drawer-head"><div class="master-brand"><div class="master-mark">WS</div><strong>Menu</strong></div><button id="closeMenu">×</button></div><nav class="drawer-links" id="drawerNav"></nav></aside><button class="mobile-backdrop" id="backdrop"></button><main class="master-main"><div class="master-content" id="content"></div></main><nav class="mobile-bottom" id="bottomNav"></nav></section>
<section class="modal hidden" id="modal" role="dialog" aria-modal="true"><article class="dialog"><header class="dialog-head"><h2 id="modalTitle">Record stock movement</h2><button class="icon-btn" id="modalClose" type="button">Close</button></header><div class="dialog-body" id="modalBody"></div></article></section>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{wireMasterShell,setAccount}from'./app/js/master-shell.js?v=7.1.0';import{normalizeUnit,CANONICAL_UNITS}from'./app/js/units.js?v=1.0.0';
const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'white-saffron-erp-auth'}}),$=s=>document.querySelector(s),num=v=>Number(v)||0,esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));let role='viewer',items=[],moves=[];const writable=()=>['admin','manager','staff'].includes(role),name=x=>x.Name||x.name||x.item_name||'Unnamed item',fmt=x=>new Intl.NumberFormat('en-US',{maximumFractionDigits:3}).format(x),date=x=>String(x.stock_updated_at||x.updated_at||x.stock_initialized_at||'').slice(0,10)||'Not recorded';
function state(x){const s=num(x.stock??x.current_stock),m=num(x.minimum_stock);return s<=0?['Out of stock','out','out']:s<=m?['Low stock','low','low']:['Healthy','healthy','healthy']}
function render(){const live=items.filter(x=>x.stock_tracking_active),low=live.filter(x=>num(x.stock??x.current_stock)<=num(x.minimum_stock)),out=live.filter(x=>num(x.stock??x.current_stock)<=0),total=live.reduce((a,x)=>a+num(x.stock??x.current_stock),0);$('#content').innerHTML=`<section class="stock-page"><header class="hero"><div><div class="eyebrow">Inventory operations</div><h1>Stock Control</h1><p>Live quantities, reorder attention, and traceable stock movement history.</p></div><div class="actions">${writable()?'<button class="btn btn-primary" id="newMove">Record movement</button>':''}<button class="btn btn-secondary" id="export">Export CSV</button></div></header><section class="kpis"><article class="kpi"><header><span>Live items</span><i>◫</i></header><strong>${live.length}</strong><small>Items currently tracked</small></article><article class="kpi"><header><span>Low stock</span><i>!</i></header><strong>${low.length}</strong><small>At or below minimum level</small></article><article class="kpi"><header><span>Out of stock</span><i>×</i></header><strong>${out.length}</strong><small>Need urgent replenishment</small></article><article class="kpi"><header><span>Total quantity</span><i>≡</i></header><strong>${fmt(total)}</strong><small>Across tracked units</small></article></section><section class="stock-card"><div class="toolbar"><label class="field"><span>Search stock</span><input id="q" type="search" placeholder="Search item or category"></label><label class="field"><span>Unit</span><select id="unit"><option value="">All units</option>${CANONICAL_UNITS.map(u=>`<option>${u}</option>`).join('')}</select></label><label class="field"><span>Status</span><select id="filterState"><option value="">All statuses</option><option value="healthy">Healthy</option><option value="low">Low stock</option><option value="out">Out of stock</option></select></label><button class="btn btn-secondary" id="clear">Clear filters</button></div><div class="section-head"><div><h2>Current stock</h2><p id="count">${live.length} live items</p></div></div><div class="table-wrapper"><table class="stock-table"><thead><tr><th>Item</th><th>Category</th><th>Unit</th><th class="numeric">Current stock</th><th class="numeric">Minimum</th><th>Status</th><th>Last updated</th></tr></thead><tbody id="rows"></tbody></table></div></section><section class="stock-card"><div class="section-head"><div><h2>Recent movement activity</h2><p>Latest receipts, usage, returns and adjustments.</p></div><a class="btn btn-secondary btn-small" href="./index.html#stock">Open full ledger</a></div><div class="recent" id="recent"></div></section></section>`;['q','unit','filterState'].forEach(id=>$('#'+id).oninput=draw);$('#clear').onclick=()=>{['q','unit','filterState'].forEach(id=>$('#'+id).value='');draw()};$('#export').onclick=exportCsv;$('#newMove')?.addEventListener('click',movementForm);$('#mobileMove')?.addEventListener('click',movementForm);draw();drawMoves()}
function draw(){const q=$('#q').value.toLowerCase(),u=$('#unit').value,f=$('#filterState').value,rows=items.filter(x=>x.stock_tracking_active).filter(x=>{const t=state(x),hay=(name(x)+' '+(x.main_category||x.category||'')).toLowerCase();return(!q||hay.includes(q))&&(!u||normalizeUnit(x.Unit||x.unit)===u)&&(!f||t[1]===f)});$('#count').textContent=`${rows.length} ${rows.length===1?'item':'items'} shown`;$('#rows').innerHTML=rows.length?rows.map(x=>{const st=state(x),initials=name(x).split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();return `<tr><td><div class="item"><span class="avatar">${esc(initials)}</span><div><strong>${esc(name(x))}</strong><small>${esc(x.sku||x.code||'Stock item')}</small></div></div></td><td>${esc(x.main_category||x.category||'Uncategorised')}</td><td>${normalizeUnit(x.Unit||x.unit)}</td><td class="numeric qty">${fmt(num(x.stock??x.current_stock))}</td><td class="numeric">${fmt(num(x.minimum_stock))}</td><td><span class="state ${st[2]}">${st[0]}</span></td><td>${date(x)}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty">No stock items match these filters.</td></tr>'}
function drawMoves(){const names=new Map(items.map(x=>[String(x.id),name(x)]));$('#recent').innerHTML=moves.slice(0,3).map(m=>`<article><small>${String(m.movement_date||m.created_at||'').slice(0,10)||'Recent'} · ${esc(String(m.movement_type||'movement').replaceAll('_',' '))}</small><strong>${esc(names.get(String(m.supply_id))||'Stock item')}</strong><span>${fmt(num(m.previous_stock))} → ${fmt(num(m.new_stock))}${m.reference?' · '+esc(m.reference):''}</span></article>`).join('')||'<article><small>No stock movements have been recorded yet.</small></article>'}
function exportCsv(){const data=[['Item','Category','Unit','Current stock','Minimum stock','Status','Last updated'],...items.filter(x=>x.stock_tracking_active).map(x=>[name(x),x.main_category||x.category||'',normalizeUnit(x.Unit||x.unit),num(x.stock??x.current_stock),num(x.minimum_stock),state(x)[0],date(x)])].map(r=>r.map(v=>'\"'+String(v).replaceAll('\"','\"\"')+'\"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download='white-saffron-stock.csv';a.click();URL.revokeObjectURL(a.href)}
function movementForm(){$('#modalBody').innerHTML=`<form id="moveForm"><p class="form-note">Every entry is saved in the stock ledger with its reason and reference.</p><label class="field"><span>Stock item</span><select id="mi" required><option value="">Select item</option>${items.filter(x=>x.stock_tracking_active).map(x=>`<option value="${x.id}">${esc(name(x))} - ${fmt(num(x.stock))} ${normalizeUnit(x.Unit||x.unit)}</option>`).join('')}</select></label><div class="form-grid"><label class="field"><span>Movement type</span><select id="mt"><option value="purchase">Stock received</option><option value="usage">Stock used</option><option value="return_in">Return in</option><option value="return_out">Return out</option><option value="adjustment_in">Adjustment in</option><option value="adjustment_out">Adjustment out</option></select></label><label class="field"><span>Quantity</span><input id="mq" type="number" min=".001" step=".001" required></label></div><label class="field"><span>Reference</span><input id="mr" placeholder="Invoice, count, waste sheet"></label><label class="field"><span>Reason</span><textarea id="ms" required placeholder="Why is this movement recorded?"></textarea></label><div class="form-actions"><button class="btn btn-secondary" type="button" id="cancel">Cancel</button><button class="btn btn-primary">Save movement</button></div></form>`;$('#modal').classList.remove('hidden');$('#cancel').onclick=close;$('#moveForm').onsubmit=saveMove}
function close(){$('#modal').classList.add('hidden')}async function saveMove(e){e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='Saving…';const{error}=await sb.rpc('record_stock_movement',{p_supply_id:Number($('#mi').value),p_movement_type:$('#mt').value,p_quantity:num($('#mq').value),p_reference:$('#mr').value.trim(),p_reason:$('#ms').value.trim(),p_movement_date:new Date().toISOString().slice(0,10),p_rate:null});if(error){alert(error.message);b.disabled=false;b.textContent='Save movement';return}close();await load();render()}
async function load(){const [a,b]=await Promise.all([sb.from('supply').select('*').eq('is_active',true).order('Name'),sb.from('stock_movements').select('*').order('created_at',{ascending:false}).limit(12)]);if(a.error)throw a.error;items=a.data||[];moves=b.error?[]:b.data||[]}function showLogin(){$('#app').hidden=true;$('#auth').hidden=false}async function start(session){$('#auth').hidden=true;$('#app').hidden=false;const r=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();role=String(r.data?.role||'viewer').toLowerCase();setAccount({role,email:session.user.email||''});wireMasterShell({active:'Stock',role,logout:async()=>{await sb.auth.signOut();showLogin()}});$('#mobileMove').hidden=!writable();await load();render()}$('#modalClose').onclick=close;$('#modal').onclick=e=>{if(e.target===$('#modal'))close()};$('#login').onsubmit=async e=>{e.preventDefault();const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#err').textContent=error.message;$('#err').hidden=false}else await start(data.session)};const{data:{session}}=await sb.auth.getSession();session?await start(session):showLogin();sb.auth.onAuthStateChange(async(e,s)=>{if(e==='SIGNED_OUT')showLogin();if(e==='SIGNED_IN'&&s)await start(s)});
</script></body></html>
