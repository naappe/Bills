<!doctype html>
<html lang="en" data-theme="light" data-density="comfortable">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Purchase Bills · White Saffron ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="./app/css/master.css?v=7.0.0"><link rel="stylesheet" href="./app/css/brand-ui.css?v=1.0.0">
  <style>.bill-page{display:grid;gap:18px}.summary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.summary-card{display:grid;grid-template-columns:50px 1fr;gap:14px;align-items:center;padding:18px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}.summary-icon{width:48px;height:48px;display:grid;place-items:center;border:1px solid currentColor;border-radius:50%;color:var(--accent);background:var(--gold-soft)}.summary-label{display:block;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.summary-value{display:block;margin-top:4px;font-family:"Playfair Display",serif;font-size:25px}.summary-meta{display:block;margin-top:3px;color:var(--muted);font-size:11px}.bill-toolbar{display:grid;grid-template-columns:minmax(240px,1.4fr) minmax(170px,.8fr) minmax(150px,.7fr) minmax(140px,.7fr) auto;gap:10px;align-items:end;padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}.empty-bills{min-height:260px;display:grid;place-items:center;padding:34px;text-align:center}.empty-illustration{width:96px;height:96px;margin:0 auto 16px;display:grid;place-items:center;border-radius:50%;background:var(--gold-soft);color:var(--gold)}.table-footer{display:flex;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.items{display:grid;gap:12px}.item{padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-muted)}.item-grid{display:grid;grid-template-columns:2fr 1.5fr .7fr .7fr .8fr .7fr auto;gap:10px;align-items:end}.totals{margin-left:auto;width:min(420px,100%);padding:16px;border:1px solid var(--border);border-radius:10px;background:var(--gold-soft)}.total{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}.total.net{font-family:"Playfair Display",serif;font-size:19px;font-weight:800}.modal-wide{width:min(1180px,96vw)}@media(max-width:1000px){.summary-grid{grid-template-columns:repeat(2,1fr)}.bill-toolbar{grid-template-columns:1fr 1fr}.bill-toolbar .search-field{grid-column:1/-1}}@media(max-width:820px){.summary-grid{grid-template-columns:1fr 1fr}.bill-toolbar,.form-grid,.item-grid{grid-template-columns:1fr}.bill-toolbar .search-field,.full{grid-column:auto}.modal-wide{width:100%;height:100%;max-height:100%;border-radius:0}}@media(max-width:480px){.summary-grid{grid-template-columns:1fr}}</style>
</head>
<body>
<section class="auth-screen" id="auth"><form class="login-card" id="login"><div class="master-mark login-mark">WS</div><div><h1>White Saffron ERP</h1><p>Sign in to manage purchase bills.</p></div><label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required></label><label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary" id="loginButton">Sign in</button><div class="alert alert-error" id="loginError" hidden></div></form></section>
<section class="master-app" id="app" hidden><header class="master-header"><div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div><nav class="master-nav" id="desktopNav"></nav><div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="userEmail"></small></div><button class="icon-button" id="logout" aria-label="Sign out"></button></div></header><header class="mobile-top"><button id="openMenu" aria-label="Open menu"></button><strong>Purchase Bills</strong><button class="btn btn-primary" id="mobileNew">New Bill</button></header><aside class="mobile-drawer" id="drawer"><div class="drawer-head"><div class="master-brand"><div class="master-mark">WS</div><strong>Menu</strong></div><button id="closeMenu">×</button></div><nav class="drawer-links" id="drawerNav"></nav></aside><button class="mobile-backdrop" id="backdrop"></button><main class="master-main"><div class="master-content" id="content"></div></main><nav class="mobile-bottom" id="bottomNav"></nav></section>
<section class="modal-overlay" id="modal" hidden><article class="modal-dialog modal-wide"><header class="modal-header"><div><h2>New Purchase Bill</h2><p>Add bill details and stock-linked items.</p></div><button class="icon-button" id="close">×</button></header><div class="modal-body" id="body"></div></article></section>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{icon,wireMasterShell,setAccount}from'./app/js/master-shell.js?v=7.0.0';
const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'white-saffron-erp-auth'}});const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v)||0,money=v=>`MVR ${num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
let role='viewer',activeUser=null,initializing=false,vendors=[],supply=[],bills=[],items=[];const canWrite=()=>['admin','manager','staff'].includes(role),empty=()=>({description:'',supply_id:'',quantity:1,unit:'PCS',unit_rate:0,gst_rate:8});function errorText(e){return[e?.message,e?.details,e?.hint,e?.code].filter(Boolean).join(' | ')||'Unknown error'}
async function load(){let r=await sb.from('vendors').select('*').is('deleted_at',null).order('name');if(r.error)throw new Error(`Vendors: ${errorText(r.error)}`);vendors=r.data||[];r=await sb.from('supply').select('*').eq('is_active',true).eq('stock_tracking_active',true).order('Name');if(r.error)throw new Error(`Inventory: ${errorText(r.error)}`);supply=r.data||[];r=await sb.from('bills').select('*').is('deleted_at',null).is('archived_at',null).order('bill_day',{ascending:false});if(r.error)throw new Error(`Bills: ${errorText(r.error)}`);bills=r.data||[]}
function render(){const total=bills.reduce((a,b)=>a+num(b.net_amount??b.amount??b.Amount),0);$('#content').innerHTML=`<section class="bill-page"><header class="dashboard-hero"><div><div class="hero-kicker">02 Purchase bills</div><h1>Purchase Bills</h1><p>Manage, search and record operational purchase bills.</p></div><div class="hero-actions"><a class="btn btn-secondary" href="./app.html">${icon('dashboard','ws-icon-sm')}Dashboard</a>${canWrite()?`<button class="btn btn-primary" id="new">${icon('plus','ws-icon-sm')}New bill</button>`:''}</div></header><section class="summary-grid"><article class="summary-card"><div class="summary-icon">${icon('bills')}</div><div><span class="summary-label">New bills</span><strong class="summary-value">${bills.length}</strong><span class="summary-meta">Current live bills</span></div></article><article class="summary-card"><div class="summary-icon">${icon('inventory')}</div><div><span class="summary-label">Live items</span><strong class="summary-value">${supply.length}</strong><span class="summary-meta">Available in bills</span></div></article><article class="summary-card"><div class="summary-icon">${icon('vendors')}</div><div><span class="summary-label">Vendors</span><strong class="summary-value">${vendors.length}</strong><span class="summary-meta">Registered suppliers</span></div></article><article class="summary-card"><div class="summary-icon">${icon('reports')}</div><div><span class="summary-label">Total value</span><strong class="summary-value">${money(total)}</strong><span class="summary-meta">Current live bills</span></div></article></section><section class="bill-toolbar"><label class="field search-field"><span>Search</span><input id="billSearch" type="search" placeholder="Vendor, invoice or reference"></label><label class="field"><span>Date range</span><input type="month" id="billMonth"></label><label class="field"><span>Vendor</span><select id="vendorFilter"><option value="">All vendors</option>${vendors.map(v=>`<option>${esc(v.name)}</option>`).join('')}</select></label><label class="field"><span>Status</span><select id="statusFilter"><option value="">All status</option><option>Pending</option><option>Paid</option><option>Recorded</option></select></label><button class="btn btn-secondary" id="clearFilters">Clear</button></section><section class="card"><div class="table-wrapper"><table><thead><tr><th>Date</th><th>Invoice no.</th><th>Vendor</th><th>Reference</th><th>Amount</th><th>Payment</th><th>Status</th></tr></thead><tbody id="billRows"></tbody></table></div><div class="table-footer"><span id="billCount"></span><span>20 / page</span></div></section></section>`;drawRows();['billSearch','billMonth','vendorFilter','statusFilter'].forEach(id=>$(`#${id}`).oninput=drawRows);$('#clearFilters').onclick=()=>{$('#billSearch').value='';$('#billMonth').value='';$('#vendorFilter').value='';$('#statusFilter').value='';drawRows()};if($('#new'))$('#new').onclick=openForm}
function drawRows(){const q=($('#billSearch')?.value||'').toLowerCase(),month=$('#billMonth')?.value||'',vendor=$('#vendorFilter')?.value||'',status=$('#statusFilter')?.value||'';const rows=bills.filter(b=>{const date=String(b.bill_day||b.bill_date||''),vn=String(b.vendor||b.Vendor||'Unknown'),ref=String(b.bill_no||b['Bill No']||'#'+b.id),pay=String(b.payment_status||''),state=String(b.approval_status||pay||'Recorded');return(!q||`${vn} ${ref} ${pay} ${state}`.toLowerCase().includes(q))&&(!month||date.startsWith(month))&&(!vendor||vn===vendor)&&(!status||pay===status||state===status)});$('#billRows').innerHTML=rows.length?rows.map(b=>`<tr><td>${esc(b.bill_day||b.bill_date||'—')}</td><td><strong>${esc(b.bill_no||b['Bill No']||'#'+b.id)}</strong></td><td>${esc(b.vendor||b.Vendor||'Unknown')}</td><td>${esc(b.reference||b.notes||'—')}</td><td><strong>${money(b.net_amount??b.amount??b.Amount)}</strong></td><td>${esc(b.payment_status||'Pending')}</td><td><span class="badge ${String(b.payment_status).toLowerCase()==='paid'?'badge-success':'badge-warning'}">${esc(b.approval_status||b.payment_status||'Recorded')}</span></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty-bills"><div><div class="empty-illustration">${icon('bills')}</div><h2>No purchase bills yet</h2><p>Complete stock counts and add your first purchase bill.</p>${canWrite()?'<button class="btn btn-primary" id="emptyNew">Create New Bill</button>':''}</div></div></td></tr>`;$('#billCount').textContent=`Showing ${rows.length} of ${bills.length} bills`;if($('#emptyNew'))$('#emptyNew').onclick=openForm}
function openForm(){items=[empty()];$('#body').innerHTML=`<form id="form"><div class="form-grid"><label class="field"><span>Date *</span><input id="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="field"><span>Vendor *</span><select id="vendor" required><option value="">Select vendor</option>${vendors.filter(v=>v.is_active!==false).map(v=>`<option value="${v.id}" data-name="${esc(v.name)}">${esc(v.name)}</option>`).join('')}</select></label><label class="field"><span>Bill number *</span><input id="number" required></label><label class="field full"><span>Notes</span><textarea id="notes"></textarea></label></div><div class="card-header" style="padding-left:0;padding-right:0;background:none"><div><h2>Items</h2><p>Vendor, date and price history update automatically.</p></div><button type="button" class="btn btn-secondary" id="add">Add Item</button></div><div class="items" id="items"></div><div class="totals"><div class="total"><span>Subtotal</span><strong id="sub">MVR 0.00</strong></div><div class="total"><span>GST</span><strong id="gst">MVR 0.00</strong></div><div class="total net"><span>Net total</span><strong id="net">MVR 0.00</strong></div></div><div class="alert alert-error" id="error" hidden></div><footer class="modal-footer"><button type="button" class="btn btn-secondary" id="cancel">Cancel</button><button class="btn btn-primary" id="save">Save Bill</button></footer></form>`;drawItems();$('#add').onclick=()=>{items.push(empty());drawItems()};$('#cancel').onclick=closeModal;$('#form').onsubmit=save;$('#modal').hidden=false;document.body.classList.add('modal-open')}
function drawItems(){$('#items').innerHTML=items.map((x,i)=>`<section class="item"><div class="item-grid"><label class="field"><span>Description *</span><input data-f="description" data-i="${i}" value="${esc(x.description)}" required></label><label class="field"><span>Stock item *</span><select data-f="supply_id" data-i="${i}" required><option value="">Select live item</option>${supply.map(s=>`<option value="${s.id}" ${String(x.supply_id)===String(s.id)?'selected':''}>${esc(s.Name||s.name)}</option>`).join('')}</select></label><label class="field"><span>Qty *</span><input data-f="quantity" data-i="${i}" type="number" min=".0001" step=".0001" value="${x.quantity}" required></label><label class="field"><span>Unit</span><input data-f="unit" data-i="${i}" value="${x.unit}"></label><label class="field"><span>Rate *</span><input data-f="unit_rate" data-i="${i}" type="number" min="0" step=".01" value="${x.unit_rate}" required></label><label class="field"><span>GST %</span><input data-f="gst_rate" data-i="${i}" type="number" min="0" max="100" step=".01" value="${x.gst_rate}"></label><button type="button" class="btn btn-secondary" data-r="${i}" ${items.length===1?'disabled':''}>Remove</button></div></section>`).join('');$$('[data-f]').forEach(e=>e.oninput=e.onchange=()=>{const i=+e.dataset.i;items[i][e.dataset.f]=e.value;if(e.dataset.f==='supply_id'){const s=supply.find(z=>String(z.id)===String(e.value));if(s){items[i].description=s.Name||s.name;items[i].unit=s.Unit||s.unit||'PCS';items[i].unit_rate=num(s.Rate||s.rate)}drawItems()}else totals()});$$('[data-r]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.r,1);drawItems()});totals()}
function totals(){let s=0,g=0;items.forEach(x=>{const v=num(x.quantity)*num(x.unit_rate);s+=v;g+=v*num(x.gst_rate)/100});$('#sub').textContent=money(s);$('#gst').textContent=money(g);$('#net').textContent=money(s+g)}
async function save(e){e.preventDefault();const payload=items.map((x,i)=>({description:String(x.description||'').trim(),supply_id:x.supply_id,quantity:num(x.quantity),unit:String(x.unit||'PCS').toUpperCase(),unit_rate:num(x.unit_rate),gst_rate:num(x.gst_rate),sort_order:i+1}));const bad=payload.findIndex(x=>!x.description||!x.supply_id||x.quantity<=0||x.unit_rate<0);if(bad>=0){$('#error').textContent=`Item ${bad+1} is incomplete.`;$('#error').hidden=false;return}const o=$('#vendor').selectedOptions[0],bill={bill_day:$('#date').value,vendor_id:$('#vendor').value,vendor:o?.dataset.name||'',bill_no:$('#number').value.trim(),notes:$('#notes').value.trim(),currency:'MVR',payment_status:'Pending',approval_status:role==='staff'?'draft':'approved'};$('#save').disabled=true;const{data,error}=await sb.rpc('create_bill_transaction',{p_bill:bill,p_items:payload});$('#save').disabled=false;if(error){$('#error').textContent=errorText(error);$('#error').hidden=false;return}closeModal();await load();render();alert(`Bill #${data} saved.`)}function closeModal(){$('#modal').hidden=true;document.body.classList.remove('modal-open')}
function showLogin(){activeUser=null;role='viewer';$('#app').hidden=true;$('#auth').hidden=false;$('#content').innerHTML=''}
async function showApp(session){if(!session?.user||initializing)return;if(activeUser===session.user.id&&!$('#app').hidden)return;initializing=true;try{activeUser=session.user.id;$('#auth').hidden=true;$('#app').hidden=false;const rr=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();role=String(rr.data?.role||'viewer').toLowerCase();setAccount({role,email:session.user.email||'',emailSelector:'#userEmail'});wireMasterShell({active:'Bills',role,logout:async()=>{await sb.auth.signOut();showLogin()}});await load();render()}catch(e){$('#content').innerHTML=`<section class="card fatal"><h2>Unable to load purchase bills</h2><p>${esc(errorText(e))}</p></section>`}finally{initializing=false}}
$('#mobileNew').onclick=()=>canWrite()&&openForm();$('#close').onclick=closeModal;$('#login').onsubmit=async e=>{e.preventDefault();const b=$('#loginButton');b.disabled=true;b.textContent='Signing in…';const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#loginError').textContent=errorText(error);$('#loginError').hidden=false;b.disabled=false;b.textContent='Sign in';return}await showApp(data.session)};const{data:{session}}=await sb.auth.getSession();if(session)await showApp(session);else showLogin();sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT')showLogin();if(event==='SIGNED_IN'&&session)await showApp(session)});
</script></body></html>
