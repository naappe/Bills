<!doctype html><html lang="en" data-theme="light" data-density="comfortable"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Live Bills · White Saffron ERP</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="./app/css/master.css?v=3.0.0"><style>.top{display:flex;gap:8px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.items{display:grid;gap:12px}.item{padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-muted)}.item-grid{display:grid;grid-template-columns:2fr 1.5fr .7fr .7fr .8fr .7fr auto;gap:10px;align-items:end}.totals{margin-left:auto;width:min(420px,100%)}.total{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}.total.net{font-size:18px;font-weight:800}.modal-wide{width:min(1180px,96vw)}@media(max-width:820px){.form-grid,.item-grid{grid-template-columns:1fr}.full{grid-column:auto}.modal-wide{width:100%;height:100%;max-height:100%;border-radius:0}}</style></head><body><section class="auth-screen" id="auth"><form class="login-card" id="login"><div class="master-mark login-mark">WS</div><div><h1>Live Bills</h1><p>Sign in with your existing Supabase account.</p></div><label class="field"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Password</span><input id="password" type="password" required></label><button class="btn btn-primary">Sign in</button><div class="alert alert-error" id="loginError" hidden></div></form></section><section class="master-app" id="app" hidden><header class="master-header"><div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Live Bills</small></div></div><nav class="master-nav"><a href="./app.html">Dashboard</a><a href="./stock-ledger.html">Inventory</a><a href="./stock-ledger.html">Stock</a><a class="active" href="./bills-live.html">Bills</a></nav><div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="userEmail"></small></div><button class="icon-button" id="logout">↪</button></div></header><main class="master-main"><div class="master-content" id="content"></div></main></section><section class="modal-overlay" id="modal" hidden><article class="modal-dialog modal-wide"><header class="modal-header"><div><h2>New Bill</h2><p>Each item needs a description and a counted/live stock item.</p></div><button class="icon-button" id="close">×</button></header><div class="modal-body" id="body"></div></article></section><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true}}),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v)||0,money=v=>`MVR ${num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;let role='viewer',vendors=[],supply=[],bills=[],items=[];const canWrite=()=>['admin','manager','staff'].includes(role),empty=()=>({description:'',supply_id:'',quantity:1,unit:'PCS',unit_rate:0,gst_rate:8});async function load(){let r=await sb.from('vendors').select('*').is('deleted_at',null).order('name');if(r.error)throw r.error;vendors=r.data||[];r=await sb.from('supply').select('*').eq('is_active',true).eq('stock_tracking_active',true).order('Name');if(r.error)throw r.error;supply=r.data||[];r=await sb.from('bills').select('*').is('deleted_at',null).is('archived_at',null).order('bill_day',{ascending:false});if(r.error)throw r.error;bills=r.data||[]}function render(){content.innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Bills</h1><p>Only new operational bills appear here. Old bills remain archived.</p></div><div class="top"><a class="btn btn-secondary" href="./app.html">Dashboard</a>${canWrite()?'<button class="btn btn-primary" id="new">＋ New Bill</button>':''}</div></header><section class="kpi-grid"><article class="card kpi-card"><span>New bills</span><strong>${bills.length}</strong></article><article class="card kpi-card"><span>Live items</span><strong>${supply.length}</strong></article><article class="card kpi-card"><span>Vendors</span><strong>${vendors.length}</strong></article><article class="card kpi-card"><span>Total value</span><strong>${money(bills.reduce((a,b)=>a+num(b.net_amount??b.amount??b.Amount),0))}</strong></article></section><section class="card"><div class="table-wrapper"><table><thead><tr><th>Date</th><th>Vendor</th><th>Reference</th><th>Status</th><th class="numeric">Amount</th></tr></thead><tbody>${bills.length?bills.map(b=>`<tr><td>${esc(b.bill_day||b.bill_date||'')}</td><td><strong>${esc(b.vendor||b.Vendor||'Unknown')}</strong></td><td>${esc(b.bill_no||b['Bill No']||'#'+b.id)}</td><td>${esc(b.payment_status||b.approval_status||'Recorded')}</td><td class="numeric"><strong>${money(b.net_amount??b.amount??b.Amount)}</strong></td></tr>`).join(''):'<tr><td colspan="5"><div class="empty-state"><div><h2>No new bills yet</h2><p>Complete physical stock counts, then add the first new bill.</p></div></div></td></tr>'}</tbody></table></div></section></section>`;if($('#new'))$('#new').onclick=openForm}function openForm(){items=[empty()];$('#body').innerHTML=`<form id="form"><div class="form-grid"><label class="field"><span>Date *</span><input id="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="field"><span>Vendor *</span><select id="vendor" required><option value="">Select vendor</option>${vendors.filter(v=>v.is_active).map(v=>`<option value="${v.id}" data-name="${esc(v.name)}">${esc(v.name)}</option>`).join('')}</select></label><label class="field"><span>Bill number *</span><input id="number" required></label><label class="field full"><span>Notes</span><textarea id="notes"></textarea></label></div><div class="card-header" style="padding-left:0;padding-right:0"><div><h2>Items</h2><p>Vendor, date and price history update automatically.</p></div><button type="button" class="btn btn-secondary" id="add">＋ Add Item</button></div><div class="items" id="items"></div><div class="totals"><div class="total"><span>Subtotal</span><strong id="sub">MVR 0.00</strong></div><div class="total"><span>GST</span><strong id="gst">MVR 0.00</strong></div><div class="total net"><span>Net total</span><strong id="net">MVR 0.00</strong></div></div><div class="alert alert-error" id="error" hidden></div><footer class="modal-footer"><button type="button" class="btn btn-secondary" id="cancel">Cancel</button><button class="btn btn-primary" id="save">Save Bill</button></footer></form>`;drawItems();$('#add').onclick=()=>{items.push(empty());drawItems()};$('#cancel').onclick=closeModal;$('#form').onsubmit=save;$('#modal').hidden=false;document.body.classList.add('modal-open')}function drawItems(){$('#items').innerHTML=items.map((x,i)=>`<section class="item"><div class="item-grid"><label class="field"><span>Description *</span><input data-f="description" data-i="${i}" value="${esc(x.description)}" required></label><label class="field"><span>Stock item *</span><select data-f="supply_id" data-i="${i}" required><option value="">Select live item</option>${supply.map(s=>`<option value="${s.id}" ${String(x.supply_id)===String(s.id)?'selected':''}>${esc(s.Name)}</option>`).join('')}</select></label><label class="field"><span>Qty *</span><input data-f="quantity" data-i="${i}" type="number" min=".0001" step=".0001" value="${x.quantity}" required></label><label class="field"><span>Unit</span><input data-f="unit" data-i="${i}" value="${x.unit}"></label><label class="field"><span>Rate *</span><input data-f="unit_rate" data-i="${i}" type="number" min="0" step=".01" value="${x.unit_rate}" required></label><label class="field"><span>GST %</span><input data-f="gst_rate" data-i="${i}" type="number" min="0" max="100" step=".01" value="${x.gst_rate}"></label><button type="button" class="btn btn-secondary" data-r="${i}" ${items.length===1?'disabled':''}>Remove</button></div></section>`).join('');$$('[data-f]').forEach(e=>e.oninput=e.onchange=()=>{const i=+e.dataset.i;items[i][e.dataset.f]=e.value;if(e.dataset.f==='supply_id'){const s=supply.find(z=>String(z.id)===String(e.value));if(s){items[i].description=s.Name;items[i].unit=s.Unit||'PCS';items[i].unit_rate=num(s.Rate)}drawItems()}else totals()});$$('[data-r]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.r,1);drawItems()});totals()}function totals(){let s=0,g=0;items.forEach(x=>{const v=num(x.quantity)*num(x.unit_rate);s+=v;g+=v*num(x.gst_rate)/100});$('#sub').textContent=money(s);$('#gst').textContent=money(g);$('#net').textContent=money(s+g)}async function save(e){e.preventDefault();const payload=items.map((x,i)=>({description:String(x.description||'').trim(),supply_id:x.supply_id,quantity:num(x.quantity),unit:String(x.unit||'PCS').toUpperCase(),unit_rate:num(x.unit_rate),gst_rate:num(x.gst_rate),sort_order:i+1})),bad=payload.findIndex(x=>!x.description||!x.supply_id||x.quantity<=0||x.unit_rate<0);if(bad>=0){$('#error').textContent=`Item ${bad+1} is incomplete.`;$('#error').hidden=false;return}const o=$('#vendor').selectedOptions[0],bill={bill_day:$('#date').value,vendor_id:$('#vendor').value,vendor:o?.dataset.name||'',bill_no:$('#number').value.trim(),notes:$('#notes').value.trim(),currency:'MVR',payment_status:'Pending',approval_status:role==='staff'?'draft':'approved'};if(!bill.vendor_id||!bill.bill_no){$('#error').textContent='Vendor and bill number are required.';$('#error').hidden=false;return}$('#save').disabled=true;const{data,error}=await sb.rpc('create_bill_transaction',{p_bill:bill,p_items:payload});$('#save').disabled=false;if(error){$('#error').textContent=error.message;$('#error').hidden=false;return}closeModal();await load();render();alert(`Bill #${data} saved. Stock, latest vendor, purchase date and price history were updated.`)}function closeModal(){$('#modal').hidden=true;document.body.classList.remove('modal-open')}async function show(session){$('#auth').hidden=true;$('#app').hidden=false;$('#userEmail').textContent=session.user.email||'';const{data}=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();role=String(data?.role||'viewer').toLowerCase();$('#role').textContent=role.toUpperCase();await load();render()}$('#login').onsubmit=async e=>{e.preventDefault();const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#loginError').textContent=error.message;$('#loginError').hidden=false}else show(data.session)};$('#logout').onclick=()=>sb.auth.signOut();$('#close').onclick=closeModal;const{data:{session}}=await sb.auth.getSession();session?show(session):null;sb.auth.onAuthStateChange((_e,s)=>s?show(s):(location.reload()));</script></body></html>
