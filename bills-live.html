border-bottom:1px solid color-mix(in srgb,var(--gold) 30%,var(--border))}.total.net{font-family:"Playfair Display",serif;font-size:19px;font-weight:800}.modal-wide{width:min(1180px,96vw)}.mobile-top,.mobile-bottom,.mobile-drawer,.mobile-backdrop{display:none}

<body>
<section class="auth-screen" id="auth">
  <form class="login-card" id="login">
    <div class="master-mark login-mark">WS</div>
    <div><h1>White Saffron ERP</h1><p>Sign in to manage purchase bills.</p></div>
    <label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required></label>
    <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" id="loginButton" type="submit">Sign in</button>
    <div class="alert alert-error" id="loginError" role="alert" hidden></div>
  </form>
</section>

<section class="master-app" id="app" hidden>
  <header class="master-header">
    <div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div>
    <nav class="master-nav" id="desktopNav"></nav>
    <div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="userEmail"></small></div><button class="icon-button" id="logout" aria-label="Sign out">↪</button></div>
  </header>
  <header class="mobile-top"><button id="openMenu" aria-label="Open menu">☰</button><strong>Purchase Bills</strong><button class="btn btn-primary" id="mobileNew" type="button">+ Bill</button></header>
  <aside class="mobile-drawer" id="drawer"><div class="drawer-head"><div class="master-brand"><div class="master-mark">WS</div><strong>Menu</strong></div><button id="closeMenu">×</button></div><nav class="drawer-links" id="drawerNav"></nav></aside>
  <button class="mobile-backdrop" id="backdrop" aria-label="Close menu"></button>
  <main class="master-main"><div class="master-content" id="content"></div></main>
  <nav class="mobile-bottom" id="bottomNav"></nav>
</section>

<section class="modal-overlay" id="modal" hidden>
  <article class="modal-dialog modal-wide">
    <header class="modal-header"><div><h2>New Purchase Bill</h2><p>Add bill details and stock-linked items.</p></div><button class="icon-button" id="close">×</button></header>
    <div class="modal-body" id="body"></div>
  </article>
</section>

<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'white-saffron-erp-auth'}});

let role='viewer',activeUser=null,initializing=false,vendors=[],supply=[],bills=[],items=[];
const pages=[['Dashboard','./app.html'],['Bills','./bills-live.html'],['Inventory','./inventory.html'],['Stock','./stock-ledger.html'],['Settings','./settings.html'],['Admin','./admin.html']];

function navigation(){const allowed=pages.filter(p=>p[0]!=='Admin'||role==='admin');const links=allowed.map((p,i)=>`<a class="${p[0]==='Bills'?'active':''}" href="${p[1]}"><span>${String(i+1).padStart(2,'0')}</span>&nbsp; ${p[0]}</a>`).join('');$('#desktopNav').innerHTML=links;$('#drawerNav').innerHTML=links;$('#bottomNav').innerHTML=[['Dashboard','./app.html','⌂'],['Bills','./bills-live.html','▤'],['Inventory','./inventory.html','▦'],['Stock','./stock-ledger.html','□']].map(p=>`<a class="${p[0]==='Bills'?'active':''}" href="${p[1]}"><b>${p[2]}</b>${p[0]}</a>`).join('')}

function errorText(error){return[error?.message,error?.details,error?.hint,error?.code].filter(Boolean).join(' | ')||'Unknown error'}
async function load(){let r=await sb.from('vendors').select('*').is('deleted_at',null).order('name');if(r.error)throw new Error(`Vendors: ${errorText(r.error)}`);vendors=r.data||[];r=await sb.from('supply').select('*').eq('is_active',true).eq('stock_tracking_active',true).order('Name');if(r.error)throw new Error(`Inventory: ${errorText(r.error)}`);supply=r.data||[];r=await sb.from('bills').select('*').is('deleted_at',null).is('archived_at',null).order('bill_day',{ascending:false});if(r.error)throw new Error(`Bills: ${errorText(r.error)}`);bills=r.data||[]}
function render(){const total=bills.reduce((a,b)=>a+num(b.net_amount??b.amount??b.Amount),0);$('#content').innerHTML=`<section class="bill-page"><section class="page-hero"><div class="page-kicker"><span class="page-number">02</span> Purchase Bills</div><div class="page-title-row"><div><h1>Purchase Bills</h1><p>Manage, search and record operational purchase bills.</p></div><div class="hero-actions"><a class="btn btn-secondary" href="./app.html">Dashboard</a>${canWrite()?'<button class="btn btn-primary" id="new">＋ New Bill</button>':''}</div></div></section><section class="summary-grid"><article class="summary-card"><div class="summary-icon">${icon('bill')}</div><div><span class="summary-label">New bills</span><strong class="summary-value">${bills.length}</strong><span class="summary-meta">This month</span></div></article><article class="summary-card"><div class="summary-icon">${icon('box')}</div><div><span class="summary-label">Live items</span><strong class="summary-value">${supply.length}</strong><span class="summary-meta">Available in bills</span></div></article><article class="summary-card"><div class="summary-icon">${icon('users')}</div><div><span class="summary-label">Vendors</span><strong class="summary-value">${vendors.length}</strong><span class="summary-meta">Registered suppliers</span></div></article><article class="summary-card"><div class="summary-icon">${icon('wallet')}</div><div><span class="summary-label">Total value</span><strong class="summary-value">${money(total)}</strong><span class="summary-meta">Current live bills</span></div></article></section><section class="bill-toolbar"><label class="field search-field"><span>Search</span><input id="billSearch" type="search" placeholder="Vendor, invoice or reference"></label><label class="field"><span>Date range</span><input type="month" id="billMonth"></label><label class="field"><span>Vendor</span><select id="vendorFilter"><option value="">All vendors</option>${vendors.map(v=>`<option>${esc(v.name)}</option>`).join('')}</select></label><label class="field"><span>Status</span><select id="statusFilter"><option value="">All status</option><option>Pending</option><option>Paid</option><option>Recorded</option></select></label><button class="btn btn-secondary" type="button" id="clearFilters">Clear</button></section><section class="card bill-table-card"><div class="table-wrapper"><table><thead><tr><th>Date</th><th>Invoice no.</th><th>Vendor</th><th>Reference</th><th class="numeric">Amount</th><th>Payment</th><th>Status</th></tr></thead><tbody id="billRows"></tbody></table></div><div class="table-footer"><span id="billCount"></span><div class="pagination-mini"><button disabled>‹</button><button class="active">1</button><button disabled>›</button></div></div></section></section>`;drawRows();['billSearch','billMonth','vendorFilter','statusFilter'].forEach(id=>$(`#${id}`).oninput=drawRows);$('#clearFilters').onclick=()=>{$('#billSearch').value='';$('#billMonth').value='';$('#vendorFilter').value='';$('#statusFilter').value='';drawRows()};if($('#new'))$('#new').onclick=openForm}
function drawRows(){const q=($('#billSearch')?.value||'').toLowerCase(),month=$('#billMonth')?.value||'',vendor=$('#vendorFilter')?.value||'',status=$('#statusFilter')?.value||'';const rows=bills.filter(b=>{const date=String(b.bill_day||b.bill_date||''),vendorName=String(b.vendor||b.Vendor||'Unknown'),reference=String(b.bill_no||b['Bill No']||'#'+b.id),payment=String(b.payment_status||''),state=String(b.approval_status||payment||'Recorded');return(!q||`${vendorName} ${reference} ${payment} ${state}`.toLowerCase().includes(q))&&(!month||date.startsWith(month))&&(!vendor||vendorName===vendor)&&(!status||payment===status||state===status)});$('#billRows').innerHTML=rows.length?rows.map(b=>`<tr><td>${esc(b.bill_day||b.bill_date||'—')}</td><td><strong>${esc(b.bill_no||b['Bill No']||'#'+b.id)}</strong></td><td>${esc(b.vendor||b.Vendor||'Unknown')}</td><td>${esc(b.reference||b.notes||'—')}</td><td class="numeric"><strong>${money(b.net_amount??b.amount??b.Amount)}</strong></td><td>${esc(b.payment_status||'Pending')}</td><td><span class="badge badge-${String(b.payment_status||'info').toLowerCase()==='paid'?'success':'warning'}">${esc(b.approval_status||b.payment_status||'Recorded')}</span></td></tr>`).join(''):`<tr><td colspan="7"><div class="empty-bills"><div><div class="empty-illustration">${icon('bill')}</div><h2>No purchase bills yet</h2><p>Complete stock counts and add your first purchase bill.</p>${canWrite()?'<button class="btn btn-primary" id="emptyNew">＋ Create New Bill</button>':''}</div></div></td></tr>`;$('#billCount').textContent=`Showing ${rows.length} of ${bills.length} bills`;if($('#emptyNew'))$('#emptyNew').onclick=openForm}
function openForm(){items=[empty()];$('#body').innerHTML=`<form id="form"><div class="form-grid"><label class="field"><span>Date *</span><input id="date" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="field"><span>Vendor *</span><select id="vendor" required><option value="">Select vendor</option>${vendors.filter(v=>v.is_active!==false).map(v=>`<option value="${v.id}" data-name="${esc(v.name)}">${esc(v.name)}</option>`).join('')}</select></label><label class="field"><span>Bill number *</span><input id="number" required></label><label class="field full"><span>Notes</span><textarea id="notes"></textarea></label></div><div class="card-header" style="padding-left:0;padding-right:0;background:none"><div><h2>Items</h2><p>Vendor, date and price history update automatically.</p></div><button type="button" class="btn btn-secondary" id="add">＋ Add Item</button></div><div class="items" id="items"></div><div class="totals"><div class="total"><span>Subtotal</span><strong id="sub">MVR 0.00</strong></div><div class="total"><span>GST</span><strong id="gst">MVR 0.00</strong></div><div class="total net"><span>Net total</span><strong id="net">MVR 0.00</strong></div></div><div class="alert alert-error" id="error" hidden></div><footer class="modal-footer"><button type="button" class="btn btn-secondary" id="cancel">Cancel</button><button class="btn btn-primary" id="save">Save Bill</button></footer></form>`;drawItems();$('#add').onclick=()=>{items.push(empty());drawItems()};$('#cancel').onclick=closeModal;$('#form').onsubmit=save;$('#modal').hidden=false;document.body.classList.add('modal-open')}

function totals(){let s=0,g=0;items.forEach(x=>{const v=num(x.quantity)*num(x.unit_rate);s+=v;g+=v*num(x.gst_rate)/100});$('#sub').textContent=money(s);$('#gst').textContent=money(g);$('#net').textContent=money(s+g)}
async function save(e){e.preventDefault();const payload=items.map((x,i)=>({description:String(x.description||'').trim(),supply_id:x.supply_id,quantity:num(x.quantity),unit:String(x.unit||'PCS').toUpperCase(),unit_rate:num(x.unit_rate),gst_rate:num(x.gst_rate),sort_order:i+1})),bad=payload.findIndex(x=>!x.description||!x.supply_id||x.quantity<=0||x.unit_rate<0);if(bad>=0){$('#error').textContent=`Item ${bad+1} is incomplete.`;$('#error').hidden=false;return}const o=$('#vendor').selectedOptions[0],bill={bill_day:$('#date').value,vendor_id:$('#vendor').value,vendor:o?.dataset.name||'',bill_no:$('#number').value.trim(),notes:$('#notes').value.trim(),currency:'MVR',payment_status:'Pending',approval_status:role==='staff'?'draft':'approved'};if(!bill.vendor_id||!bill.bill_no){$('#error').textContent='Vendor and bill number are required.';$('#error').hidden=false;return}$('#save').disabled=true;const{data,error}=await sb.rpc('create_bill_transaction',{p_bill:bill,p_items:payload});$('#save').disabled=false;if(error){$('#error').textContent=errorText(error);$('#error').hidden=false;return}closeModal();await load();render();alert(`Bill #${data} saved. Stock and purchase history were updated.`)}
function closeModal(){$('#modal').hidden=true;document.body.classList.remove('modal-open')}
async function showApp(session){if(!session?.user||initializing)return;if(activeUser===session.user.id&&!$('#app').hidden)return;initializing=true;try{activeUser=session.user.id;$('#auth').hidden=true;$('#app').hidden=false;$('#userEmail').textContent=session.user.email||'';const{data,error}=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();if(error)console.warn(error);role=String(data?.role||'viewer').toLowerCase();$('#role').textContent=role.toUpperCase();navigation();await load();render()}catch(error){$('#content').innerHTML=`<section class="card fatal"><h2>Unable to load purchase bills</h2><p>${esc(errorText(error))}</p><button class="btn btn-secondary" id="retry">Try again</button></section>`;$('#retry').onclick=()=>{activeUser=null;showApp(session)}}finally{initializing=false;$('#loginButton').disabled=false;$('#loginButton').textContent='Sign in'}}
$('#openMenu').onclick=()=>drawer(true);$('#closeMenu').onclick=()=>drawer(false);$('#backdrop').onclick=()=>drawer(false);$('#mobileNew').onclick=()=>canWrite()&&openForm();$('#close').onclick=closeModal;
$('#login').onsubmit=async e=>{e.preventDefault();const b=$('#loginButton');b.disabled=true;b.textContent='Signing in…';$('#loginError').hidden=true;const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#loginError').textContent=errorText(error);$('#loginError').hidden=false;b.disabled=false;b.textContent='Sign in';return}if(data.session)await showApp(data.session)};
$('#logout').onclick=async()=>{await sb.auth.signOut();showLogin()};
const{data:{session},error}=await sb.auth.getSession();if(error){$('#loginError').textContent=errorText(error);$('#loginError').hidden=false;showLogin()}else if(session)await showApp(session);else showLogin();
sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT'){showLogin();return}if(event==='SIGNED_IN'&&session)await showApp(session)});
</script>
