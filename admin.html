<!doctype html><html lang="en" data-theme="light" data-density="comfortable"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · White Saffron ERP</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="./app/css/master.css?v=3.0.0"><style>.shell{max-width:1500px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:20px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs a{text-decoration:none}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.role-select{min-width:130px}.name-input{min-width:170px}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notice{padding:12px;border-radius:10px;background:var(--surface-muted);color:var(--muted)}@media(max-width:820px){.top{align-items:flex-start;flex-direction:column}.grid2{grid-template-columns:1fr}.table-wrapper table{min-width:900px}}</style></head><body><section id="login" class="auth-screen"><form id="loginForm" class="login-card"><div class="master-mark login-mark">WS</div><div><h1>Admin sign in</h1><p>Uses the existing Supabase accounts.</p></div><label class="field"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Password</span><input id="password" type="password" required></label><button class="btn btn-primary">Sign in</button><div id="loginError" class="alert alert-error" hidden></div></form></section><main id="app" hidden><header class="master-header"><div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Administration</small></div></div><nav class="master-nav"><a href="./index.html#dashboard">Dashboard</a><a href="./index.html#vendors">Inventory</a><a href="./stock-ledger.html">Stock</a><a href="./index.html#bills">Bills</a><a class="active" href="./admin.html">Admin</a><a href="./settings.html">Settings</a></nav><div class="master-account"><div class="master-account-copy"><strong id="role">ADMIN</strong><small id="userEmail"></small></div><button id="logout" class="icon-button">↪</button></div></header><div class="shell"><div class="top"><div><h1>Admin</h1><p>Manage Supabase users, roles and account access.</p></div><button id="refresh" class="btn btn-secondary">Refresh</button></div><section class="kpi-grid" id="kpis"></section><section class="card" style="margin-top:16px"><header class="card-header"><div><h2>Users</h2><p>Roles control navigation and database permissions.</p></div></header><div class="table-wrapper"><table><thead><tr><th>User</th><th>Display name</th><th>Role</th><th>Active</th><th>Last sign-in</th><th>Action</th></tr></thead><tbody id="usersBody"></tbody></table></div></section><div id="msg" class="alert" hidden style="margin-top:16px"></div></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true}}),$=x=>document.querySelector(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let session=null;function showMsg(t,ok=true){const m=$('#msg');m.textContent=t;m.className='alert '+(ok?'alert-success':'alert-error');m.hidden=false}async function load(){const{data,error}=await s.rpc('admin_list_users');if(error){showMsg(error.message,false);return}const rows=data||[];$('#kpis').innerHTML=`<article class="card kpi-card"><span>Total users</span><strong>${rows.length}</strong></article><article class="card kpi-card"><span>Active</span><strong>${rows.filter(x=>x.is_active).length}</strong></article><article class="card kpi-card"><span>Admins</span><strong>${rows.filter(x=>x.role==='admin').length}</strong></article><article class="card kpi-card"><span>Staff</span><strong>${rows.filter(x=>x.role==='staff').length}</strong></article>`;$('#usersBody').innerHTML=rows.map(u=>`<tr data-id="${u.user_id}"><td><strong>${esc(u.email)}</strong><small>${esc(u.user_id)}</small></td><td><input class="name-input" value="${esc(u.display_name||'')}"></td><td><select class="role-select">${['admin','manager','staff','viewer'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></td><td><input class="active" type="checkbox" ${u.is_active?'checked':''}></td><td>${u.last_sign_in_at?new Date(u.last_sign_in_at).toLocaleString():'Never'}</td><td><button class="btn btn-small btn-primary save">Save</button></td></tr>`).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const tr=b.closest('tr');b.disabled=true;const{error}=await s.rpc('admin_update_user',{p_user_id:tr.dataset.id,p_role:tr.querySelector('.role-select').value,p_is_active:tr.querySelector('.active').checked,p_display_name:tr.querySelector('.name-input').value});b.disabled=false;if(error)showMsg(error.message,false);else{showMsg('User updated.');load()}})}async function open(sess){session=sess;$('#login').hidden=true;$('#app').hidden=false;$('#userEmail').textContent=sess.user.email||'';const{data}=await s.from('user_roles').select('role').eq('user_id',sess.user.id).eq('is_active',true).maybeSingle();if((data?.role||'').toLowerCase()!=='admin'){showMsg('Admin access required.',false);return}await s.rpc('touch_user_activity');load()}$('#loginForm').onsubmit=async e=>{e.preventDefault();const{data,error}=await s.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#loginError').textContent=error.message;$('#loginError').hidden=false}else open(data.session)};$('#logout').onclick=()=>s.auth.signOut();$('#refresh').onclick=load;const{data:{session:ses}}=await s.auth.getSession();ses?open(ses):null;s.auth.onAuthStateChange((_e,x)=>{if(!x){$('#app').hidden=true;$('#login').hidden=false}});</script></body></html>
