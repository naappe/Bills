<!doctype html><html lang="en" data-theme="light" data-density="comfortable"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>White Saffron ERP</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="./app/css/master.css?v=3.0.0"><style>.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.quick a{text-decoration:none}.quick .card{padding:20px}.price-up{color:var(--danger)}.price-down{color:var(--success)}@media(max-width:820px){.quick{grid-template-columns:1fr}}</style></head><body><section class="auth-screen" id="auth"><form class="login-card" id="login"><div class="master-mark login-mark">WS</div><div><h1>White Saffron ERP</h1><p>Sign in with your existing Supabase account.</p></div><label class="field"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Password</span><input id="password" type="password" required></label><button class="btn btn-primary">Sign in</button><div class="alert alert-error" id="err" hidden></div></form></section><section class="master-app" id="app" hidden><header class="master-header"><div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div><nav class="master-nav" id="nav"></nav><div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="user"></small></div><button class="icon-button" id="logout">↪</button></div></header><main class="master-main"><div class="master-content" id="content"></div></main></section><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true}}),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v)||0,money=v=>`MVR ${num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;let role='viewer';function links(){const all=[['Dashboard','./app.html'],['Inventory','./stock-ledger.html'],['Stock','./stock-ledger.html'],['Bills','./bills-live.html'],['Settings','./settings.html'],['Admin','./admin.html']];$('#nav').innerHTML=all.filter(x=>x[0]!=='Admin'||role==='admin').map(x=>`<a class="${x[0]==='Dashboard'?'active':''}" href="${x[1]}">${x[0]}</a>`).join('')}async function render(){const [s,b,p]=await Promise.all([sb.from('supply').select('*').eq('is_active',true),sb.from('bills').select('*').is('deleted_at',null).is('archived_at',null),sb.from('supply_purchase_summary').select('*')]);if(s.error)throw s.error;if(b.error)throw b.error;const supply=s.data||[],bills=b.data||[],prices=p.data||[],live=supply.filter(x=>x.stock_tracking_active),waiting=supply.filter(x=>!x.stock_tracking_active),low=live.filter(x=>num(x.stock)<=num(x.minimum_stock));$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Dashboard</h1><p>Count stock first. Then enter only new bills.</p></div><div class="page-actions"><a class="btn btn-secondary" href="./stock-ledger.html">Open Stock</a><a class="btn btn-primary" href="./bills-live.html">＋ New Bill</a></div></header><section class="kpi-grid"><article class="card kpi-card"><span>Waiting for count</span><strong>${waiting.length}</strong></article><article class="card kpi-card"><span>Live stock</span><strong>${live.length}</strong></article><article class="card kpi-card"><span>Low stock</span><strong>${low.length}</strong></article><article class="card kpi-card"><span>New bills</span><strong>${bills.length}</strong></article></section><section class="quick"><a href="./stock-ledger.html"><article class="card"><h2>Inventory</h2><p>Catalogue, categories, units and physical count.</p></article></a><a href="./stock-ledger.html"><article class="card"><h2>Stock</h2><p>Opening balances, live stock, usage and returns.</p></article></a><a href="./bills-live.html"><article class="card"><h2>Bills</h2><p>New bills update stock, vendor, date and prices.</p></article></a><a href="./food-explorer.html"><article class="card"><h2>Food Catalogue</h2><p>Search and add F&B items without raw API data.</p></article></a><a href="./settings.html"><article class="card"><h2>Settings</h2><p>Company, GST and inventory go-live controls.</p></article></a>${role==='admin'?'<a href="./admin.html"><article class="card"><h2>Admin</h2><p>Users, roles, access and security.</p></article></a>':''}</section><section class="card"><header class="card-header"><div><h2>Latest price changes</h2><p>Vendor and purchase date update from each new bill.</p></div></header><div class="table-wrapper"><table><thead><tr><th>Item</th><th>Vendor</th><th>Date</th><th class="numeric">Latest</th><th class="numeric">Previous</th><th>Change</th></tr></thead><tbody>${prices.slice(0,20).map(r=>{const d=num(r.price_difference??r.difference),pc=num(r.price_change_percent??r.change_percent);return`<tr><td><strong>${esc(r.supply_name||r.item_name||r.name)}</strong></td><td>${esc(r.latest_vendor||r.vendor_name||'—')}</td><td>${esc(r.latest_purchase_date||r.cost_date||'—')}</td><td class="numeric">${money(r.latest_price||r.normalized_unit_rate)}</td><td class="numeric">${r.previous_price==null?'—':money(r.previous_price)}</td><td>${r.previous_price==null?'New price':d>0?`<span class="price-up">↑ ${money(d)} (${pc.toFixed(1)}%)</span>`:d<0?`<span class="price-down">↓ ${money(Math.abs(d))} (${Math.abs(pc).toFixed(1)}%)</span>`:'— Unchanged'}</td></tr>`}).join('')}</tbody></table></div></section></section>`}async function show(session){$('#auth').hidden=true;$('#app').hidden=false;$('#user').textContent=session.user.email||'';const{data}=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();role=String(data?.role||'viewer').toLowerCase();$('#role').textContent=role.toUpperCase();links();await render()}$('#login').onsubmit=async e=>{e.preventDefault();const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#err').textContent=error.message;$('#err').hidden=false}else show(data.session)};$('#logout').onclick=()=>sb.auth.signOut();const{data:{session}}=await sb.auth.getSession();session?show(session):null;sb.auth.onAuthStateChange((_e,s)=>s?show(s):location.reload());</script></body></html>
