<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>White Saffron Procurement ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="./app/css/master.css?v=3.5.0">
  <link rel="stylesheet" href="./app/css/brand-ui.css?v=1.0.0">
</head>
<body>
<section class="auth-screen" id="auth">
  <form class="login-card" id="login">
    <div class="master-mark login-mark">WS</div>
    <div><h1>White Saffron ERP</h1><p>Procurement, stock and purchasing in one secure workspace.</p><div class="brand-divider"></div></div>
    <label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required></label>
    <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-primary" id="loginButton" type="submit">Sign in</button>
    <div class="alert alert-error" id="err" role="alert" hidden></div>
  </form>
</section>
<section class="master-app" id="app" hidden>
  <header class="master-header">
    <div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div>
    <nav class="master-nav" id="desktopNav"></nav>
    <div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="user"></small></div><button class="icon-button" id="logout" aria-label="Sign out"></button></div>
  </header>
  <header class="mobile-top"><button id="openMenu" aria-label="Open menu"></button><strong>Dashboard</strong><a class="btn btn-primary" href="./bills-live.html">New Bill</a></header>
  <aside class="mobile-drawer" id="drawer"><div class="drawer-head"><div class="master-brand"><div class="master-mark">WS</div><strong>Menu</strong></div><button id="closeMenu" aria-label="Close menu">×</button></div><nav class="drawer-links" id="drawerNav"></nav></aside>
  <button class="mobile-backdrop" id="backdrop" aria-label="Close menu"></button>
  <main class="master-main"><div class="master-content" id="content"></div></main>
  <nav class="mobile-bottom" id="bottomNav"></nav>
</section>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'white-saffron-erp-auth'}});
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v)||0,money=v=>`MVR ${num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const icons={dashboard:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-7h6v7"/>',bills:'<path d="M6 2h9l3 3v17l-3-2-3 2-3-2-3 2V2Z"/><path d="M9 8h6M9 12h6M9 16h4"/>',inventory:'<path d="m3 7 9-4 9 4-9 4-9-4Z"/><path d="m3 7 9 4 9-4M3 7v10l9 4 9-4V7M12 11v10"/>',stock:'<path d="M4 8h16v12H4z"/><path d="M7 8V5h10v3M8 13h8M8 17h5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21h-4v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H3v-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3V3h4v.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.1v4H21a1.7 1.7 0 0 0-1.6 1Z"/>',admin:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',plus:'<path d="M12 5v14M5 12h14"/>',logout:'<path d="M10 17l5-5-5-5M15 12H3"/><path d="M14 3h7v18h-7"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',alert:'<path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5M12 17h.01"/>',trend:'<path d="m3 17 6-6 4 4 8-9"/><path d="M14 6h7v7"/>',users:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 11a3 3 0 0 1 5 2.2M17 17a5 5 0 0 1 4 3"/>',calendar:'<path d="M4 5h16v16H4zM8 3v4M16 3v4M4 10h16"/>'};
const icon=(name,cls='')=>`<svg class="ws-icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${icons[name]||icons.dashboard}</svg>`;
let role='viewer',activeUser=null,initializing=false;
const pages=[['Dashboard','./app.html','dashboard'],['Bills','./bills-live.html','bills'],['Inventory','./inventory.html','inventory'],['Stock','./stock-ledger.html','stock'],['Settings','./settings.html','settings'],['Admin','./admin.html','admin']];
function nav(){const allowed=pages.filter(p=>p[0]!=='Admin'||role==='admin');const links=allowed.map((p,i)=>`<a class="${p[0]==='Dashboard'?'active':''}" href="${p[1]}">${icon(p[2],'ws-icon-sm')}<span class="nav-index">${String(i+1).padStart(2,'0')}</span>${p[0]}</a>`).join('');$('#desktopNav').innerHTML=links;$('#drawerNav').innerHTML=links;$('#bottomNav').innerHTML=allowed.slice(0,4).map(p=>`<a class="${p[0]==='Dashboard'?'active':''}" href="${p[1]}">${icon(p[2])}<span>${p[0]}</span></a>`).join('');$('#logout').innerHTML=icon('logout');$('#openMenu').innerHTML=icon('menu')}
function drawer(v){$('#drawer').classList.toggle('open',v);$('#backdrop').classList.toggle('show',v)}
function showLogin(){activeUser=null;role='viewer';$('#app').hidden=true;$('#auth').hidden=false;$('#content').innerHTML='';$('#loginButton').disabled=false;$('#loginButton').textContent='Sign in'}
function errorText(error){if(!error)return'Unknown error';return[error.message,error.details,error.hint,error.code].filter(Boolean).join(' | ')||JSON.stringify(error)}
async function safeQuery(label,promise,required=false){const result=await promise;if(result.error){console.error(`${label} query failed`,result.error);if(required)throw new Error(`${label}: ${errorText(result.error)}`);return{data:[],warning:`${label}: ${errorText(result.error)}`}}return{data:result.data||[],warning:''}}
function billDate(value){const d=value?new Date(value):null;if(!d||Number.isNaN(d.getTime()))return{day:'—',mon:''};return{day:String(d.getDate()).padStart(2,'0'),mon:d.toLocaleString('en',{month:'short'})}}
async function renderDashboard(){
 $('#content').innerHTML='<p>Loading dashboard…</p>';
 const [supplyResult,billsResult,priceResult]=await Promise.all([
  safeQuery('Inventory',sb.from('supply').select('*').limit(500),true),
  safeQuery('Bills',sb.from('bills').select('*').order('bill_date',{ascending:false}).limit(50)),
  safeQuery('Price summary',sb.from('supply_purchase_summary').select('*').limit(20))
 ]);
 const supply=supplyResult.data.filter(x=>x.is_active!==false),bills=billsResult.data.filter(x=>!x.deleted_at&&!x.archived_at),prices=priceResult.data;
 const live=supply.filter(x=>x.stock_tracking_active),waiting=supply.filter(x=>!x.stock_tracking_active),low=live.filter(x=>num(x.stock)<=num(x.minimum_stock));
 const activeVendors=new Set(bills.map(b=>b.vendor_name||b.vendor).filter(Boolean)).size;
 const monthSpend=bills.reduce((sum,b)=>sum+num(b.net_amount||b.total_amount||b.amount),0);
 const changes=prices.filter(p=>num(p.price_difference)!==0).length;
 const warnings=[supplyResult.warning,billsResult.warning,priceResult.warning].filter(Boolean);
 const recentBills=bills.slice(0,5),lowItems=low.slice(0,5),activity=[
  ['Inventory ready',`${live.length} tracked items`],['Bills loaded',`${bills.length} recent records`],['Stock attention',`${low.length} low-stock items`],['Price review',`${changes} changed prices`]
 ];
 $('#content').innerHTML=`<section class="dashboard-shell">
 ${warnings.length?`<div class="alert alert-warning"><strong>Some dashboard data could not load.</strong><br>${warnings.map(esc).join('<br>')}</div>`:''}
 <header class="dashboard-hero"><div><div class="hero-kicker">01 Procurement overview</div><h1>Dashboard</h1><p>See what needs attention, then move directly to the next task.</p></div><div class="hero-actions"><a class="btn btn-secondary" href="./inventory.html">${icon('inventory','ws-icon-sm')}Review items</a><a class="btn btn-primary" href="./bills-live.html">${icon('plus','ws-icon-sm')}New bill</a></div></header>
 <section class="metric-groups">
  <article class="metric-group"><div class="metric-group-title">${icon('bills','ws-icon-sm')}Purchasing</div><div class="metric-pair"><div class="mini-metric"><span>Recent bills</span><strong>${bills.length}</strong></div><div class="mini-metric"><span>Total spend</span><strong>${money(monthSpend).replace('MVR ','')}</strong></div></div></article>
  <article class="metric-group"><div class="metric-group-title">${icon('inventory','ws-icon-sm')}Inventory</div><div class="metric-pair"><div class="mini-metric"><span>Live items</span><strong>${live.length}</strong></div><div class="mini-metric"><span>Low stock</span><strong>${low.length}</strong></div></div></article>
  <article class="metric-group"><div class="metric-group-title">${icon('users','ws-icon-sm')}Suppliers</div><div class="metric-pair"><div class="mini-metric"><span>Active vendors</span><strong>${activeVendors}</strong></div><div class="mini-metric"><span>Price changes</span><strong>${changes}</strong></div></div></article>
 </section>
 <section class="dashboard-grid">
  <article class="card"><header class="card-header"><div><h2 class="section-title">Recent bills</h2><p>Latest purchasing activity</p></div><a class="btn btn-small btn-secondary" href="./bills-live.html">View all</a></header><ul class="compact-list">${recentBills.length?recentBills.map(b=>{const d=billDate(b.bill_date);return`<li><span class="list-date"><strong>${d.day}</strong>${d.mon}</span><span class="list-main"><strong>${esc(b.vendor_name||b.vendor||'Unknown vendor')}</strong><span>${esc(b.invoice_number||b.bill_number||'Purchase bill')}</span></span><span class="list-value">${money(b.net_amount||b.total_amount||b.amount)}</span></li>`}).join(''):'<li><span class="list-main"><strong>No bills found</strong><span>Add a new purchase bill to begin.</span></span></li>'}</ul></article>
  <article class="card"><header class="card-header"><div><h2 class="section-title">Low stock alerts</h2><p>Items that may need reordering</p></div><a class="btn btn-small btn-secondary" href="./stock-ledger.html">Open stock</a></header><ul class="compact-list">${lowItems.length?lowItems.map(x=>`<li><span class="stock-dot ${num(x.stock)<=0?'critical':''}"></span><span class="list-main"><strong>${esc(x.name||x.item_name||'Unnamed item')}</strong><span>Current ${num(x.stock)} · Minimum ${num(x.minimum_stock)}</span></span><span class="badge ${num(x.stock)<=0?'badge-danger':'badge-warning'}">${num(x.stock)<=0?'Critical':'Low'}</span></li>`).join(''):'<li><span class="list-main"><strong>No low-stock items</strong><span>Tracked inventory is currently healthy.</span></span></li>'}</ul></article>
  <article class="card"><header class="card-header"><div><h2 class="section-title">Quick actions</h2><p>Common daily tasks</p></div></header><div class="quick-actions"><a class="quick-action" href="./bills-live.html">${icon('plus')}Add new bill</a><a class="quick-action" href="./inventory.html">${icon('inventory')}Add or review item</a><a class="quick-action" href="./stock-ledger.html">${icon('stock')}Stock adjustment</a><a class="quick-action" href="./settings.html">${icon('settings')}Operational settings</a></div></article>
 </section>
 <article class="card"><header class="card-header"><div><h2 class="section-title">Latest price changes</h2><p>Normalized purchase-price movement</p></div></header><div class="table-wrapper"><table><thead><tr><th>Item</th><th>Vendor</th><th>Date</th><th>Latest</th><th>Previous</th><th>Change</th></tr></thead><tbody>${prices.length?prices.map(r=>`<tr><td><strong>${esc(r.supply_name||r.item_name||r.name||'Unnamed item')}</strong></td><td>${esc(r.latest_vendor||r.vendor_name||'—')}</td><td>${esc(r.latest_purchase_date||r.cost_date||'—')}</td><td>${money(r.latest_price||r.normalized_unit_rate)}</td><td>${r.previous_price==null?'—':money(r.previous_price)}</td><td><span class="badge ${num(r.price_difference)>0?'badge-danger':num(r.price_difference)<0?'badge-success':'badge-info'}">${num(r.price_difference)>0?'Increased':num(r.price_difference)<0?'Decreased':'No change'}</span></td></tr>`).join(''):'<tr><td colspan="6" class="empty-row">No price history available.</td></tr>'}</tbody></table></div></article>
 <article class="card"><header class="card-header"><div><h2 class="section-title">Activity summary</h2><p>Current operational position</p></div></header><div class="activity-strip">${activity.map(a=>`<div class="activity-item"><strong>${a[0]}</strong><span>${a[1]}</span></div>`).join('')}</div></article>
 </section>`;
}
async function showApp(session){if(!session?.user||initializing)return;if(activeUser===session.user.id&&!$('#app').hidden)return;initializing=true;try{activeUser=session.user.id;$('#auth').hidden=true;$('#app').hidden=false;$('#user').textContent=session.user.email||'';const roleResult=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();if(roleResult.error)console.warn('Role lookup failed',roleResult.error);role=String(roleResult.data?.role||'viewer').toLowerCase();$('#role').textContent=role.toUpperCase();nav();await renderDashboard()}catch(error){const detail=errorText(error);console.error('Application initialization failed:',detail,error);$('#content').innerHTML=`<section class="card fatal"><h2>Unable to load dashboard</h2><p>The login succeeded, but required ERP data could not be loaded.</p><div class="error-code">${esc(detail)}</div><button class="btn btn-secondary" id="retry">Try again</button></section>`;$('#retry').onclick=()=>{activeUser=null;showApp(session)}}finally{initializing=false;$('#loginButton').disabled=false;$('#loginButton').textContent='Sign in'}}
$('#openMenu').onclick=()=>drawer(true);$('#closeMenu').onclick=()=>drawer(false);$('#backdrop').onclick=()=>drawer(false);
$('#login').onsubmit=async e=>{e.preventDefault();const b=$('#loginButton');if(b.disabled)return;$('#err').hidden=true;b.disabled=true;b.textContent='Signing in…';const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#err').textContent=errorText(error);$('#err').hidden=false;b.disabled=false;b.textContent='Sign in';return}if(data.session)await showApp(data.session)};
$('#logout').onclick=async()=>{await sb.auth.signOut();showLogin()};
const{data:{session},error}=await sb.auth.getSession();if(error){$('#err').textContent=errorText(error);$('#err').hidden=false;showLogin()}else if(session)await showApp(session);else showLogin();
sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT'){showLogin();return}if(event==='SIGNED_IN'&&session)await showApp(session)});
</script>
</body>
</html>
