<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>White Saffron Procurement ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="./app/css/master.css?v=7.0.0">
  <link rel="stylesheet" href="./app/css/brand-ui.css?v=1.0.0">
</head>
<body>
<section class="auth-screen" id="auth"><form class="login-card" id="login"><div class="master-mark login-mark">WS</div><div><h1>White Saffron ERP</h1><p>Procurement, stock and purchasing in one secure workspace.</p><div class="brand-divider"></div></div><label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required></label><label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary" id="loginButton" type="submit">Sign in</button><div class="alert alert-error" id="err" hidden></div></form></section>
<section class="master-app" id="app" hidden>
  <header class="master-header"><div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div><nav class="master-nav" id="desktopNav"></nav><div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="user"></small></div><button class="icon-button" id="logout" aria-label="Sign out"></button></div></header>
  <header class="mobile-top"><button id="openMenu" aria-label="Open menu"></button><strong>Dashboard</strong><a class="btn btn-primary" href="./bills-live.html">New Bill</a></header>
  <aside class="mobile-drawer" id="drawer"><div class="drawer-head"><div class="master-brand"><div class="master-mark">WS</div><strong>Menu</strong></div><button id="closeMenu" aria-label="Close menu">×</button></div><nav class="drawer-links" id="drawerNav"></nav></aside><button class="mobile-backdrop" id="backdrop" aria-label="Close menu"></button>
  <main class="master-main"><div class="master-content" id="content"></div></main><nav class="mobile-bottom" id="bottomNav"></nav>
</section>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{icon,wireMasterShell,setAccount}from'./app/js/master-shell.js?v=7.0.0';
const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'white-saffron-erp-auth'}});
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v)||0,money=v=>`MVR ${num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
let role='viewer',activeUser=null,initializing=false;
function errorText(e){return[e?.message,e?.details,e?.hint,e?.code].filter(Boolean).join(' | ')||'Unknown error'}
async function query(label,promise,required=false){const r=await promise;if(r.error){if(required)throw new Error(`${label}: ${errorText(r.error)}`);return{data:[],warning:`${label}: ${errorText(r.error)}`}}return{data:r.data||[],warning:''}}
function billDate(value){const d=value?new Date(value):null;if(!d||Number.isNaN(d.getTime()))return{day:'—',mon:''};return{day:String(d.getDate()).padStart(2,'0'),mon:d.toLocaleString('en',{month:'short'})}}
async function renderDashboard(){
 $('#content').innerHTML='<p>Loading dashboard…</p>';
 const [sr,br,pr]=await Promise.all([query('Inventory',sb.from('supply').select('*').limit(500),true),query('Bills',sb.from('bills').select('*').order('bill_date',{ascending:false}).limit(50)),query('Price summary',sb.from('supply_purchase_summary').select('*').limit(20))]);
 const supply=sr.data.filter(x=>x.is_active!==false),bills=br.data.filter(x=>!x.deleted_at&&!x.archived_at),prices=pr.data,live=supply.filter(x=>x.stock_tracking_active),low=live.filter(x=>num(x.stock)<=num(x.minimum_stock)),vendors=new Set(bills.map(b=>b.vendor_name||b.vendor).filter(Boolean)).size,spend=bills.reduce((a,b)=>a+num(b.net_amount||b.total_amount||b.amount),0),changes=prices.filter(p=>num(p.price_difference)!==0).length,warnings=[sr.warning,br.warning,pr.warning].filter(Boolean),recent=bills.slice(0,5);
 $('#content').innerHTML=`<section class="dashboard-shell">${warnings.length?`<div class="alert alert-warning"><strong>Some dashboard data could not load.</strong><br>${warnings.map(esc).join('<br>')}</div>`:''}<header class="dashboard-hero"><div><div class="hero-kicker">01 Procurement overview</div><h1>Dashboard</h1><p>See what needs attention, then move directly to the next task.</p></div><div class="hero-actions"><a class="btn btn-secondary" href="./inventory.html">${icon('inventory','ws-icon-sm')}Review items</a><a class="btn btn-primary" href="./bills-live.html">${icon('plus','ws-icon-sm')}New bill</a></div></header><section class="metric-groups"><article class="metric-group"><div class="metric-group-title">${icon('bills','ws-icon-sm')}Purchasing</div><div class="metric-pair"><div class="mini-metric"><span>Recent bills</span><strong>${bills.length}</strong></div><div class="mini-metric"><span>Total spend</span><strong>${money(spend).replace('MVR ','')}</strong></div></div></article><article class="metric-group"><div class="metric-group-title">${icon('inventory','ws-icon-sm')}Inventory</div><div class="metric-pair"><div class="mini-metric"><span>Live items</span><strong>${live.length}</strong></div><div class="mini-metric"><span>Low stock</span><strong>${low.length}</strong></div></div></article><article class="metric-group"><div class="metric-group-title">${icon('vendors','ws-icon-sm')}Suppliers</div><div class="metric-pair"><div class="mini-metric"><span>Active vendors</span><strong>${vendors}</strong></div><div class="mini-metric"><span>Price changes</span><strong>${changes}</strong></div></div></article></section><section class="dashboard-grid"><article class="card"><header class="card-header"><div><h2 class="section-title">Recent bills</h2><p>Latest purchasing activity</p></div><a class="btn btn-small btn-secondary" href="./bills-live.html">View all</a></header><ul class="compact-list">${recent.length?recent.map(b=>{const d=billDate(b.bill_date||b.bill_day);return`<li><span class="list-date"><strong>${d.day}</strong>${d.mon}</span><span class="list-main"><strong>${esc(b.vendor_name||b.vendor||'Unknown vendor')}</strong><span>${esc(b.invoice_number||b.bill_no||'Purchase bill')}</span></span><span class="list-value">${money(b.net_amount||b.total_amount||b.amount)}</span></li>`}).join(''):'<li><span class="list-main"><strong>No bills found</strong><span>Add a new purchase bill to begin.</span></span></li>'}</ul></article><article class="card"><header class="card-header"><div><h2 class="section-title">Low stock alerts</h2><p>Items that may need reordering</p></div><a class="btn btn-small btn-secondary" href="./stock-ledger.html">Open stock</a></header><ul class="compact-list">${low.length?low.slice(0,5).map(x=>`<li><span class="stock-dot ${num(x.stock)<=0?'critical':''}"></span><span class="list-main"><strong>${esc(x.name||x.Name||x.item_name||'Unnamed item')}</strong><span>Current ${num(x.stock)} · Minimum ${num(x.minimum_stock)}</span></span><span class="badge ${num(x.stock)<=0?'badge-danger':'badge-warning'}">${num(x.stock)<=0?'Critical':'Low'}</span></li>`).join(''):'<li><span class="list-main"><strong>No low-stock items</strong><span>Tracked inventory is currently healthy.</span></span></li>'}</ul></article><article class="card"><header class="card-header"><div><h2 class="section-title">Quick actions</h2><p>Common daily tasks</p></div></header><div class="quick-actions"><a class="quick-action" href="./bills-live.html">${icon('plus')}Add new bill</a><a class="quick-action" href="./inventory.html">${icon('inventory')}Add or review item</a><a class="quick-action" href="./stock-ledger.html">${icon('stock')}Stock adjustment</a><a class="quick-action" href="./settings.html">${icon('settings')}Operational settings</a></div></article></section><article class="card"><header class="card-header"><div><h2 class="section-title">Latest price changes</h2><p>Recent vendor and normalized purchase-price movement.</p></div></header><div class="table-wrapper"><table><thead><tr><th>Item</th><th>Vendor</th><th>Date</th><th>Latest</th><th>Previous</th><th>Change</th></tr></thead><tbody>${prices.length?prices.map(r=>`<tr><td><strong>${esc(r.supply_name||r.item_name||r.name||'Unnamed item')}</strong></td><td>${esc(r.latest_vendor||r.vendor_name||'—')}</td><td>${esc(r.latest_purchase_date||r.cost_date||'—')}</td><td>${money(r.latest_price||r.normalized_unit_rate)}</td><td>${r.previous_price==null?'—':money(r.previous_price)}</td><td>${num(r.price_difference)>0?'↑ Increased':num(r.price_difference)<0?'↓ Decreased':'—'}</td></tr>`).join(''):'<tr><td colspan="6" class="empty-row">No price history available.</td></tr>'}</tbody></table></div></article></section>`;
}
function showLogin(){activeUser=null;role='viewer';$('#app').hidden=true;$('#auth').hidden=false;$('#content').innerHTML='';$('#loginButton').disabled=false;$('#loginButton').textContent='Sign in'}
async function showApp(session){if(!session?.user||initializing)return;if(activeUser===session.user.id&&!$('#app').hidden)return;initializing=true;try{activeUser=session.user.id;$('#auth').hidden=true;$('#app').hidden=false;const rr=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();role=String(rr.data?.role||'viewer').toLowerCase();setAccount({role,email:session.user.email||''});wireMasterShell({active:'Dashboard',role,logout:async()=>{await sb.auth.signOut();showLogin()}});await renderDashboard()}catch(e){$('#content').innerHTML=`<section class="card fatal"><h2>Unable to load dashboard</h2><p>${esc(errorText(e))}</p></section>`}finally{initializing=false}}
$('#login').onsubmit=async e=>{e.preventDefault();const b=$('#loginButton');b.disabled=true;b.textContent='Signing in…';$('#err').hidden=true;const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#err').textContent=errorText(error);$('#err').hidden=false;b.disabled=false;b.textContent='Sign in';return}await showApp(data.session)};
const{data:{session},error}=await sb.auth.getSession();if(error){$('#err').textContent=errorText(error);$('#err').hidden=false;showLogin()}else if(session)await showApp(session);else showLogin();sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT')showLogin();if(event==='SIGNED_IN'&&session)await showApp(session)});
</script>
</body></html>
