<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>White Saffron Procurement ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="./app/css/master.css?v=3.4.0">
  <style>
    *{box-sizing:border-box}.auth-screen{min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:#f5f7fa}.login-card{width:min(100%,420px)}.login-card button{min-height:46px}.login-status{font-size:13px;color:var(--muted);text-align:center}.dash-actions{display:flex;gap:10px;flex-wrap:wrap}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{padding:16px 18px;min-height:108px}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.metric strong{display:block;margin-top:12px;font-size:28px}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.module-grid a{text-decoration:none;color:inherit}.module{height:100%;padding:18px}.module p{color:var(--muted);margin-bottom:0}.mobile-top,.mobile-bottom,.mobile-drawer,.mobile-backdrop{display:none}.empty-row{text-align:center;color:var(--muted);padding:28px}.fatal{max-width:700px;margin:40px auto}.alert[hidden]{display:none!important}
    @media(max-width:900px){.metric-grid{grid-template-columns:repeat(2,1fr)}.module-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:820px){body{padding:64px 0 78px}.master-header{display:none}.master-main{padding-top:0}.master-content{padding:16px 14px 28px}.mobile-top{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;align-items:center;justify-content:space-between;height:58px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 3px 14px rgba(15,23,42,.06)}.mobile-top button{width:42px;height:42px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:20px}.mobile-top strong{font-size:16px}.mobile-bottom{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--border);padding:7px 8px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -5px 18px rgba(15,23,42,.08)}.mobile-bottom a{text-decoration:none;text-align:center;color:var(--muted);font-size:11px;font-weight:700;padding:6px 2px;border-radius:8px}.mobile-bottom a.active{background:var(--primary-soft);color:var(--primary)}.mobile-bottom b{display:block;font-size:18px}.mobile-drawer{position:fixed;top:0;left:0;bottom:0;z-index:100;width:min(82vw,330px);display:block;background:#fff;padding:18px;transform:translateX(-105%);transition:.2s ease;box-shadow:14px 0 30px rgba(15,23,42,.18)}.mobile-drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--border)}.drawer-links{display:grid;gap:8px;margin-top:16px}.drawer-links a{text-decoration:none;color:var(--text);font-weight:700;padding:13px 14px;border-radius:10px}.drawer-links a.active{background:var(--primary-soft);color:var(--primary)}.mobile-backdrop{position:fixed;inset:0;z-index:90;display:none;background:rgba(15,23,42,.45);border:0}.mobile-backdrop.show{display:block}.page-header{display:block}.dash-actions{margin-top:14px}.dash-actions .btn{flex:1}.metric{min-height:92px;padding:14px}.metric strong{font-size:25px}.module{padding:15px}.table-wrapper{overflow:auto}}
    @media(max-width:430px){.module-grid{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr 1fr}.metric span{font-size:11px}}
  </style>
</head>
<body>
  <section class="auth-screen" id="auth">
    <form class="login-card" id="login">
      <div class="master-mark login-mark">WS</div>
      <div><h1>White Saffron ERP</h1><p>Sign in with your existing Supabase account.</p></div>
      <label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required></label>
      <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-primary" id="loginButton" type="submit">Sign in</button>
      <div class="alert alert-error" id="err" role="alert" hidden></div>
      <div class="login-status" id="loginStatus">Secure procurement workspace</div>
    </form>
  </section>

  <section class="master-app" id="app" hidden>
    <header class="master-header">
      <div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div>
      <nav class="master-nav" id="desktopNav"></nav>
      <div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="user"></small></div><button class="icon-button" id="logout" aria-label="Sign out">↪</button></div>
    </header>
    <header class="mobile-top"><button id="openMenu" aria-label="Open menu">☰</button><strong>Dashboard</strong><a class="btn btn-primary" style="padding:9px 12px" href="./bills-live.html">+ Bill</a></header>
    <aside class="mobile-drawer" id="drawer"><div class="drawer-head"><div style="display:flex;gap:10px;align-items:center"><div class="master-mark">WS</div><strong>Menu</strong></div><button id="closeMenu" aria-label="Close menu">×</button></div><nav class="drawer-links" id="drawerNav"></nav></aside>
    <button class="mobile-backdrop" id="backdrop" aria-label="Close menu"></button>
    <main class="master-main"><div class="master-content" id="content"><p>Loading dashboard…</p></div></main>
    <nav class="mobile-bottom" id="bottomNav"></nav>
  </section>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'white-saffron-erp-auth'}});
    const $=selector=>document.querySelector(selector);
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const num=value=>Number(value)||0;
    const money=value=>`MVR ${num(value).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
    let role='viewer';
    let initializedUserId=null;
    let initializing=false;

    const pages=[['Dashboard','./app.html'],['Inventory','./inventory.html'],['Stock','./stock-ledger.html'],['Bills','./bills-live.html'],['Settings','./settings.html'],['Admin','./admin.html']];

    function navigation(){
      const allowed=pages.filter(page=>page[0]!=='Admin'||role==='admin');
      const links=allowed.map(page=>`<a class="${page[0]==='Dashboard'?'active':''}" href="${page[1]}">${page[0]}</a>`).join('');
      $('#desktopNav').innerHTML=links;
      $('#drawerNav').innerHTML=links;
      $('#bottomNav').innerHTML=[['Dashboard','./app.html','⌂'],['Inventory','./inventory.html','▦'],['Stock','./stock-ledger.html','▤'],['Bills','./bills-live.html','＋']].map(page=>`<a class="${page[0]==='Dashboard'?'active':''}" href="${page[1]}"><b>${page[2]}</b>${page[0]}</a>`).join('');
    }

    function drawer(open){$('#drawer').classList.toggle('open',open);$('#backdrop').classList.toggle('show',open)}

    function showLogin(){
      initializedUserId=null;role='viewer';
      $('#app').hidden=true;$('#auth').hidden=false;
      $('#user').textContent='';$('#role').textContent='';$('#content').innerHTML='';
      $('#loginButton').disabled=false;$('#loginButton').textContent='Sign in';
    }

    async function renderDashboard(){
      $('#content').innerHTML='<p>Loading dashboard…</p>';
      const [supplyResult,billsResult,priceResult]=await Promise.all([
        sb.from('supply').select('id,name,stock,minimum_stock,stock_tracking_active,is_active').eq('is_active',true),
        sb.from('bills').select('id,bill_date,net_amount,vendor_name').is('deleted_at',null).is('archived_at',null).order('bill_date',{ascending:false}).limit(50),
        sb.from('supply_purchase_summary').select('*').limit(20)
      ]);
      const firstError=supplyResult.error||billsResult.error||priceResult.error;
      if(firstError)throw firstError;
      const supply=supplyResult.data||[],bills=billsResult.data||[],prices=priceResult.data||[];
      const live=supply.filter(item=>item.stock_tracking_active),waiting=supply.filter(item=>!item.stock_tracking_active),low=live.filter(item=>num(item.stock)<=num(item.minimum_stock));
      $('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Dashboard</h1><p>Review inventory, complete stock counts, then enter new purchase bills.</p></div><div class="dash-actions"><a class="btn btn-secondary" href="./inventory.html">Review Items</a><a class="btn btn-primary" href="./bills-live.html">＋ New Bill</a></div></header><section class="metric-grid"><article class="card metric"><span>Waiting for count</span><strong>${waiting.length}</strong></article><article class="card metric"><span>Live stock</span><strong>${live.length}</strong></article><article class="card metric"><span>Low stock</span><strong>${low.length}</strong></article><article class="card metric"><span>Recent bills</span><strong>${bills.length}</strong></article></section><section class="module-grid"><a href="./inventory.html"><article class="card module"><h2>Inventory</h2><p>Review canonical item names, categories and default units.</p></article></a><a href="./stock-ledger.html"><article class="card module"><h2>Stock</h2><p>Record counts and inspect movement history.</p></article></a><a href="./bills-live.html"><article class="card module"><h2>Bills</h2><p>Add purchases and update tracked stock.</p></article></a><a href="./settings.html"><article class="card module"><h2>Settings</h2><p>Manage company, GST and operational controls.</p></article></a>${role==='admin'?'<a href="./admin.html"><article class="card module"><h2>Admin</h2><p>Manage users, roles and access.</p></article></a>':''}</section><section class="card"><header class="card-header"><div><h2>Latest price changes</h2><p>Recent vendor and normalized purchase-price movement.</p></div></header><div class="table-wrapper"><table><thead><tr><th>Item</th><th>Vendor</th><th>Date</th><th>Latest</th><th>Previous</th><th>Change</th></tr></thead><tbody>${prices.length?prices.map(row=>`<tr><td><strong>${esc(row.supply_name||row.item_name||row.name||'Unnamed item')}</strong></td><td>${esc(row.latest_vendor||row.vendor_name||'—')}</td><td>${esc(row.latest_purchase_date||row.cost_date||'—')}</td><td>${money(row.latest_price||row.normalized_unit_rate)}</td><td>${row.previous_price==null?'—':money(row.previous_price)}</td><td>${num(row.price_difference)>0?'↑ Increased':num(row.price_difference)<0?'↓ Decreased':'—'}</td></tr>`).join(''):'<tr><td colspan="6" class="empty-row">No price history available.</td></tr>'}</tbody></table></div></section></section>`;
    }

    async function showApp(session){
      if(!session?.user||initializing)return;
      if(initializedUserId===session.user.id&&!$('#app').hidden)return;
      initializing=true;
      try{
        initializedUserId=session.user.id;
        $('#auth').hidden=true;$('#app').hidden=false;$('#user').textContent=session.user.email||'';
        const {data,error}=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();
        if(error)console.warn('Role lookup failed:',error.message);
        role=String(data?.role||'viewer').toLowerCase();$('#role').textContent=role.toUpperCase();
        navigation();await renderDashboard();
      }catch(error){
        console.error('Application initialization failed:',error);
        $('#content').innerHTML=`<section class="card fatal"><h2>Unable to load dashboard</h2><p>${esc(error?.message||'Unknown application error.')}</p><button class="btn btn-secondary" onclick="location.reload()">Try again</button></section>`;
      }finally{initializing=false;$('#loginButton').disabled=false;$('#loginButton').textContent='Sign in'}
    }

    $('#openMenu').onclick=()=>drawer(true);$('#closeMenu').onclick=()=>drawer(false);$('#backdrop').onclick=()=>drawer(false);
    $('#login').onsubmit=async event=>{
      event.preventDefault();
      const button=$('#loginButton');if(button.disabled)return;
      $('#err').hidden=true;button.disabled=true;button.textContent='Signing in…';
      const {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});
      if(error){$('#err').textContent=error.message;$('#err').hidden=false;button.disabled=false;button.textContent='Sign in';return}
      if(!data.session){$('#err').textContent='No authenticated session was created.';$('#err').hidden=false;button.disabled=false;button.textContent='Sign in';}
    };
    $('#logout').onclick=async()=>{await sb.auth.signOut();showLogin()};

    const {data:{session},error:sessionError}=await sb.auth.getSession();
    if(sessionError){$('#err').textContent=sessionError.message;$('#err').hidden=false;showLogin()}else if(session){await showApp(session)}else{showLogin()}

    sb.auth.onAuthStateChange(async(event,currentSession)=>{
      if(event==='SIGNED_OUT'){showLogin();return}
      if(event==='SIGNED_IN'&&currentSession){await showApp(currentSession)}
    });
  </script>
</body>
</html>
