<!doctype html><html lang="en" data-theme="light" data-density="comfortable"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>White Saffron ERP</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="./app/css/master.css?v=3.2.0"><style>.dash-actions{display:flex;gap:10px}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{padding:16px 18px;min-height:112px}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.metric strong{display:block;margin-top:12px;font-size:30px}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.module-grid a{text-decoration:none}.module{padding:18px;min-height:128px}.module h2{margin:0 0 8px}.module p{margin:0;color:var(--muted)}.price-up{color:var(--danger)}.price-down{color:var(--success)}.mobile-nav{display:none}.compact-title{margin-bottom:4px}@media(max-width:820px){body{padding-bottom:76px}.master-header{display:none}.master-main{padding-top:0}.master-content{padding:18px 14px 28px}.page-shell{gap:14px}.page-header{display:block}.page-header h1{font-size:32px;line-height:1.05}.page-header p{font-size:16px;line-height:1.35;margin-top:6px}.dash-actions{margin-top:14px}.dash-actions .btn{flex:1;min-height:46px;padding:10px 12px}.metric-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{min-height:92px;padding:14px}.metric strong{font-size:27px;margin-top:8px}.module-grid{grid-template-columns:1fr 1fr;gap:10px}.module{min-height:105px;padding:15px}.module h2{font-size:20px}.module p{font-size:14px;line-height:1.35}.mobile-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--border);padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(15,23,42,.08)}.mobile-nav a{text-decoration:none;text-align:center;color:var(--muted);font-size:11px;font-weight:700;padding:7px 2px;border-radius:9px}.mobile-nav a.active{background:var(--primary-soft);color:var(--primary)}.mobile-nav b{display:block;font-size:18px;line-height:1;margin-bottom:4px}.table-wrapper{overflow:auto}.card-header{padding:16px}.quick-hide-mobile{display:none}}@media(max-width:430px){.module-grid{grid-template-columns:1fr}.module{min-height:auto}.metric-grid{grid-template-columns:1fr 1fr}}</style></head><body><section class="auth-screen" id="auth"><form class="login-card" id="login"><div class="master-mark login-mark">WS</div><div><h1>White Saffron ERP</h1><p>Sign in with your existing Supabase account.</p></div><label class="field"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Password</span><input id="password" type="password" required></label><button class="btn btn-primary">Sign in</button><div class="alert alert-error" id="err" hidden></div></form></section><section class="master-app" id="app" hidden><header class="master-header"><div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div><nav class="master-nav" id="nav"></nav><div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="user"></small></div><button class="icon-button" id="logout">↪</button></div></header><main class="master-main"><div class="master-content" id="content"></div></main><nav class="mobile-nav" id="mobileNav"></nav></section><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true}}),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v)||0,money=v=>`MVR ${num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;let role='viewer';function links(){const all=[['Dashboard','./app.html'],['Inventory','./inventory.html'],['Stock','./stock-ledger.html'],['Bills','./bills-live.html'],['Settings','./settings.html'],['Admin','./admin.html']];$('#nav').innerHTML=all.filter(x=>x[0]!=='Admin'||role==='admin').map(x=>`<a class="${x[0]==='Dashboard'?'active':''}" href="${x[1]}">${x[0]}</a>`).join('');const mobile=[['Dashboard','./app.html','⌂'],['Inventory','./inventory.html','▦'],['Stock','./stock-ledger.html','▤'],['Bills','./bills-live.html','＋']];$('#mobileNav').innerHTML=mobile.map(x=>`<a class="${x[0]==='Dashboard'?'active':''}" href="${x[1]}"><b>${x[2]}</b>${x[0]}</a>`).join('')}async function render(){const[s,b,p]=await Promise.all([sb.from('supply').select('*').eq('is_active',true),sb.from('bills').select('*').is('deleted_at',null).is('archived_at',null),sb.from('supply_purchase_summary').select('*')]);if(s.error)throw s.error;if(b.error)throw b.error;const supply=s.data||[],bills=b.data||[],prices=p.data||[],live=supply.filter(x=>x.stock_tracking_active),waiting=supply.filter(x=>!x.stock_tracking_active),low=live.filter(x=>num(x.stock)<=num(x.minimum_stock));$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1 class="compact-title">Dashboard</h1><p>Start with Inventory, complete the stock count, then enter new bills.</p></div><div class="dash-actions"><a class="btn btn-secondary" href="./inventory.html">Review Items</a><a class="btn btn-primary" href="./bills-live.html">＋ New Bill</a></div></header><section class="metric-grid"><article class="card metric"><span>Waiting for count</span><strong>${waiting.length}</strong></article><article class="card metric"><span>Live stock</span><strong>${live.length}</strong></article><article class="card metric"><span>Low stock</span><strong>${low.length}</strong></article><article class="card metric"><span>New bills</span><strong>${bills.length}</strong></article></section><section class="module-grid"><a href="./inventory.html"><article class="card module"><h2>Inventory</h2><p>Review old bill names, categories and units.</p></article></a><a href="./stock-ledger.html"><article class="card module"><h2>Stock</h2><p>Count items and manage live quantities.</p></article></a><a href="./bills-live.html"><article class="card module"><h2>Bills</h2><p>Add new purchases and update stock automatically.</p></article></a><a href="./settings.html"><article class="card module"><h2>Settings</h2><p>Company, GST and go-live controls.</p></article></a>${role==='admin'?'<a href="./admin.html"><article class="card module"><h2>Admin</h2><p>Users, roles and access.</p></article></a>':''}</section><section class="card"><header class="card-header"><div><h2>Latest price changes</h2><p>Newest vendor, purchase date and price movement.</p></div></header><div class="table-wrapper"><table><thead><tr><th>Item</th><th>Vendor</th><th>Date</th><th class="numeric">Latest</th><th class="numeric">Previous</th><th>Change</th></tr></thead><tbody>${prices.slice(0,20).map(r=>{const d=num(r.price_difference??r.difference),pc=num(r.price_change_percent??r.change_percent);return`<tr><td><strong>${esc(r.supply_name||r.item_name||r.name)}</strong></td><td>${esc(r.latest_vendor||r.vendor_name||'—')}</td><td>${esc(r.latest_purchase_date||r.cost_date||'—')}</td><td class="numeric">${money(r.latest_price||r.normalized_unit_rate)}</td><td class="numeric">${r.previous_price==null?'—':money(r.previous_price)}</td><td>${r.previous_price==null?'New':d>0?`<span class="price-up">↑ ${money(d)} (${pc.toFixed(1)}%)</span>`:d<0?`<span class="price-down">↓ ${money(Math.abs(d))} (${Math.abs(pc).toFixed(1)}%)</span>`:'—'}</td></tr>`}).join('')}</tbody></table></div></section></section>`}async function show(session){$('#auth').hidden=true;$('#app').hidden=false;$('#user').textContent=session.user.email||'';const{data}=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();role=String(data?.role||'viewer').toLowerCase();$('#role').textContent=role.toUpperCase();links();await render()}$('#login').onsubmit=async e=>{e.preventDefault();const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#err').textContent=error.message;$('#err').hidden=false}else show(data.session)};$('#logout').onclick=()=>sb.auth.signOut();const{data:{session}}=await sb.auth.getSession();session?show(session):null;sb.auth.onAuthStateChange((_e,s)=>s?show(s):location.reload());</script></body></html>
