<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>White Saffron ERP</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="./app/css/master.css?v=3.3.0"><style>.dash-actions{display:flex;gap:10px}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.metric{padding:16px 18px;min-height:112px}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase}.metric strong{display:block;margin-top:12px;font-size:30px}.module-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.module-grid a{text-decoration:none}.module{padding:18px}.module p{color:var(--muted)}.mobile-top,.mobile-bottom,.mobile-drawer,.mobile-backdrop{display:none}@media(max-width:820px){body{padding:64px 0 76px}.master-header{display:none}.master-main{padding-top:0}.master-content{padding:16px 14px 28px}.mobile-top{position:fixed;top:0;left:0;right:0;z-index:80;display:flex;align-items:center;justify-content:space-between;height:58px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 3px 14px rgba(15,23,42,.06)}.mobile-top button{width:42px;height:42px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:20px}.mobile-top strong{font-size:16px}.mobile-bottom{position:fixed;left:0;right:0;bottom:0;z-index:70;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--border);padding:7px 8px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -5px 18px rgba(15,23,42,.08)}.mobile-bottom a{text-decoration:none;text-align:center;color:var(--muted);font-size:11px;font-weight:700;padding:6px 2px;border-radius:8px}.mobile-bottom a.active{background:var(--primary-soft);color:var(--primary)}.mobile-bottom b{display:block;font-size:18px}.mobile-drawer{position:fixed;top:0;left:0;bottom:0;z-index:100;width:min(82vw,330px);display:block;background:#fff;padding:18px;transform:translateX(-105%);transition:.2s ease;box-shadow:14px 0 30px rgba(15,23,42,.18)}.mobile-drawer.open{transform:translateX(0)}.drawer-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--border)}.drawer-links{display:grid;gap:8px;margin-top:16px}.drawer-links a{text-decoration:none;color:var(--text);font-weight:700;padding:13px 14px;border-radius:10px}.drawer-links a.active{background:var(--primary-soft);color:var(--primary)}.mobile-backdrop{position:fixed;inset:0;z-index:90;display:none;background:rgba(15,23,42,.45);border:0}.mobile-backdrop.show{display:block}.page-header{display:block}.dash-actions{margin-top:14px}.dash-actions .btn{flex:1}.metric-grid{grid-template-columns:repeat(2,1fr);gap:10px}.metric{min-height:92px;padding:14px}.metric strong{font-size:27px}.module-grid{grid-template-columns:1fr 1fr;gap:10px}.module{padding:15px}.module h2{font-size:20px}.module p{font-size:14px}.table-wrapper{overflow:auto}}@media(max-width:430px){.module-grid{grid-template-columns:1fr}}</style></head><body><section class="auth-screen" id="auth"><form class="login-card" id="login"><div class="master-mark login-mark">WS</div><div><h1>White Saffron ERP</h1><p>Sign in with your existing Supabase account.</p></div><label class="field"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Password</span><input id="password" type="password" required></label><button class="btn btn-primary">Sign in</button><div class="alert alert-error" id="err" hidden></div></form></section><section class="master-app" id="app" hidden><header class="master-header"><div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div><nav class="master-nav" id="desktopNav"></nav><div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="user"></small></div><button class="icon-button" id="logout">↪</button></div></header><header class="mobile-top"><button id="openMenu">☰</button><strong>Dashboard</strong><a class="btn btn-primary" style="padding:9px 12px" href="./bills-live.html">+ Bill</a></header><aside class="mobile-drawer" id="drawer"><div class="drawer-head"><div style="display:flex;gap:10px;align-items:center"><div class="master-mark">WS</div><strong>Menu</strong></div><button id="closeMenu">×</button></div><nav class="drawer-links" id="drawerNav"></nav></aside><button class="mobile-backdrop" id="backdrop"></button><main class="master-main"><div class="master-content" id="content"></div></main><nav class="mobile-bottom" id="bottomNav"></nav></section><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true}}),$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>Number(v)||0,money=v=>`MVR ${num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;let role='viewer';const pages=[['Dashboard','./app.html'],['Inventory','./inventory.html'],['Stock','./stock-ledger.html'],['Bills','./bills-live.html'],['Settings','./settings.html'],['Admin','./admin.html']];function nav(){const allowed=pages.filter(x=>x[0]!=='Admin'||role==='admin');$('#desktopNav').innerHTML=allowed.map(x=>`<a class="${x[0]==='Dashboard'?'active':''}" href="${x[1]}">${x[0]}</a>`).join('');$('#drawerNav').innerHTML=allowed.map(x=>`<a class="${x[0]==='Dashboard'?'active':''}" href="${x[1]}">${x[0]}</a>`).join('');$('#bottomNav').innerHTML=[['Dashboard','./app.html','⌂'],['Inventory','./inventory.html','▦'],['Stock','./stock-ledger.html','▤'],['Bills','./bills-live.html','＋']].map(x=>`<a class="${x[0]==='Dashboard'?'active':''}" href="${x[1]}"><b>${x[2]}</b>${x[0]}</a>`).join('')}function drawer(v){$('#drawer').classList.toggle('open',v);$('#backdrop').classList.toggle('show',v)}async function render(){const[s,b,p]=await Promise.all([sb.from('supply').select('*').eq('is_active',true),sb.from('bills').select('*').is('deleted_at',null).is('archived_at',null),sb.from('supply_purchase_summary').select('*')]);const supply=s.data||[],bills=b.data||[],prices=p.data||[],live=supply.filter(x=>x.stock_tracking_active),waiting=supply.filter(x=>!x.stock_tracking_active),low=live.filter(x=>num(x.stock)<=num(x.minimum_stock));$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Dashboard</h1><p>Start with Inventory, complete the stock count, then enter new bills.</p></div><div class="dash-actions"><a class="btn btn-secondary" href="./inventory.html">Review Items</a><a class="btn btn-primary" href="./bills-live.html">＋ New Bill</a></div></header><section class="metric-grid"><article class="card metric"><span>Waiting for count</span><strong>${waiting.length}</strong></article><article class="card metric"><span>Live stock</span><strong>${live.length}</strong></article><article class="card metric"><span>Low stock</span><strong>${low.length}</strong></article><article class="card metric"><span>New bills</span><strong>${bills.length}</strong></article></section><section class="module-grid"><a href="./inventory.html"><article class="card module"><h2>Inventory</h2><p>Review old bill names, categories and units.</p></article></a><a href="./stock-ledger.html"><article class="card module"><h2>Stock</h2><p>Count items and manage live quantities.</p></article></a><a href="./bills-live.html"><article class="card module"><h2>Bills</h2><p>Add new purchases and update stock.</p></article></a><a href="./settings.html"><article class="card module"><h2>Settings</h2><p>Company, GST and go-live controls.</p></article></a>${role==='admin'?'<a href="./admin.html"><article class="card module"><h2>Admin</h2><p>Users, roles and access.</p></article></a>':''}</section><section class="card"><header class="card-header"><div><h2>Latest price changes</h2><p>Newest vendor, purchase date and price movement.</p></div></header><div class="table-wrapper"><table><thead><tr><th>Item</th><th>Vendor</th><th>Date</th><th>Latest</th><th>Previous</th><th>Change</th></tr></thead><tbody>${prices.slice(0,20).map(r=>`<tr><td><strong>${esc(r.supply_name||r.item_name||r.name)}</strong></td><td>${esc(r.latest_vendor||r.vendor_name||'—')}</td><td>${esc(r.latest_purchase_date||r.cost_date||'—')}</td><td>${money(r.latest_price||r.normalized_unit_rate)}</td><td>${r.previous_price==null?'—':money(r.previous_price)}</td><td>${num(r.price_difference)>0?'↑ Increased':num(r.price_difference)<0?'↓ Decreased':'—'}</td></tr>`).join('')}</tbody></table></div></section></section>`}async function show(session){$('#auth').hidden=true;$('#app').hidden=false;$('#user').textContent=session.user.email||'';const{data}=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();role=String(data?.role||'viewer').toLowerCase();$('#role').textContent=role.toUpperCase();nav();await render()}$('#openMenu').onclick=()=>drawer(true);$('#closeMenu').onclick=()=>drawer(false);$('#backdrop').onclick=()=>drawer(false);$('#login').onsubmit=async e=>{e.preventDefault();const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#err').textContent=error.message;$('#err').hidden=false}else show(data.session)};$('#logout').onclick=()=>sb.auth.signOut();const{data:{session}}=await sb.auth.getSession();if(session)await show(session);sb.auth.onAuthStateChange((_e,s)=>s?show(s):location.reload());</script></body></html>
