<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prices · White Saffron ERP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="./app/css/master.css?v=7.2.0"><link rel="stylesheet" href="./app/css/brand-ui.css?v=7.2.0">
<style>.price-shell{display:grid;gap:18px}.toolbar{display:grid;grid-template-columns:minmax(260px,1fr) 220px 220px;gap:10px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.summary-card{padding:18px}.summary-card span{display:block;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.summary-card strong{display:block;margin-top:8px;font:700 26px/1.1 "Playfair Display",serif}.numeric{text-align:right}@media(max-width:900px){.toolbar,.summary-grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.toolbar,.summary-grid{grid-template-columns:1fr}}</style>
</head><body>
<section class="auth-screen" id="auth"><form class="login-card" id="login"><div class="master-mark login-mark">WS</div><div><h1>White Saffron ERP</h1><p>Sign in to review purchase prices.</p></div><label class="field"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Password</span><input id="password" type="password" required></label><button class="btn btn-primary" id="loginButton">Sign in</button><div class="alert alert-error" id="err" hidden></div></form></section>
<section class="master-app" id="app" hidden><header class="master-header"><div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div><nav class="master-nav" id="desktopNav"></nav><div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="user"></small></div><button class="icon-button" id="logout"></button></div></header><header class="mobile-top"><button id="openMenu"></button><strong>Prices</strong><a class="btn btn-primary" href="./bills-live.html">New Bill</a></header><aside class="mobile-drawer" id="drawer"><div class="drawer-head"><div class="master-brand"><div class="master-mark">WS</div><strong>Menu</strong></div><button id="closeMenu">×</button></div><nav class="drawer-links" id="drawerNav"></nav></aside><button class="mobile-backdrop" id="backdrop"></button><main class="master-main"><div class="master-content" id="content"></div></main><nav class="mobile-bottom" id="bottomNav"></nav></section>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{wireMasterShell,setAccount}from'./app/js/master-shell.js?v=7.2.0';
import{normalizeUnit,CANONICAL_UNITS}from'./app/js/units.js?v=1.0.1';
const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'white-saffron-erp-auth'}});
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c])),num=v=>Number(v)||0,money=v=>`MVR ${num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;let role='viewer',rows=[];
function showLogin(){$('#app').hidden=true;$('#auth').hidden=false}
function val(x,...keys){for(const k of keys)if(x?.[k]!==undefined&&x?.[k]!==null)return x[k];return''}
function render(){const changed=rows.filter(x=>num(val(x,'price_difference','difference'))!==0),vendors=new Set(rows.map(x=>val(x,'vendor','vendor_name','latest_vendor')).filter(Boolean)),products=new Set(rows.map(x=>val(x,'product','product_name','Name','name','item_name')).filter(Boolean));$('#content').innerHTML=`<section class="price-shell"><header class="dashboard-hero"><div><div class="hero-kicker">05 Price intelligence</div><h1>Prices</h1><p>Compare latest purchase prices, previous prices and vendor movement.</p></div></header><section class="summary-grid"><article class="card summary-card"><span>Products</span><strong>${products.size}</strong></article><article class="card summary-card"><span>Vendors</span><strong>${vendors.size}</strong></article><article class="card summary-card"><span>Price changes</span><strong>${changed.length}</strong></article><article class="card summary-card"><span>Records</span><strong>${rows.length}</strong></article></section><section class="card toolbar"><label class="field"><span>Search</span><input id="q" placeholder="Search product or vendor"></label><label class="field"><span>Vendor</span><select id="vendor"><option value="">All vendors</option>${[...vendors].sort().map(v=>`<option>${esc(v)}</option>`).join('')}</select></label><label class="field"><span>Unit</span><select id="unit"><option value="">All units</option>${CANONICAL_UNITS.map(u=>`<option>${u}</option>`).join('')}</select></label></section><section class="card"><div class="table-wrapper"><table><thead><tr><th>Product</th><th>Vendor</th><th>Unit</th><th class="numeric">Latest</th><th class="numeric">Previous</th><th class="numeric">Change</th><th>Last purchase</th></tr></thead><tbody id="rows"></tbody></table></div></section></section>`;['q','vendor','unit'].forEach(id=>$(`#${id}`).oninput=draw);draw()}
function draw(){const q=($('#q').value||'').toLowerCase(),vendor=$('#vendor').value,unit=$('#unit').value;const filtered=rows.filter(x=>{const name=String(val(x,'product','product_name','Name','name','item_name')),v=String(val(x,'vendor','vendor_name','latest_vendor')),u=normalizeUnit(val(x,'unit','Unit','purchase_unit'));return(!q||`${name} ${v}`.toLowerCase().includes(q))&&(!vendor||v===vendor)&&(!unit||u===unit)});$('#rows').innerHTML=filtered.length?filtered.map(x=>{const latest=num(val(x,'latest_price','latest_rate','price','Rate')),previous=num(val(x,'previous_price','previous_rate')),diff=val(x,'price_difference','difference')!==''?num(val(x,'price_difference','difference')):latest-previous;return`<tr><td><strong>${esc(val(x,'product','product_name','Name','name','item_name')||'Unnamed item')}</strong></td><td>${esc(val(x,'vendor','vendor_name','latest_vendor')||'—')}</td><td>${normalizeUnit(val(x,'unit','Unit','purchase_unit'))}</td><td class="numeric">${money(latest)}</td><td class="numeric">${previous?money(previous):'—'}</td><td class="numeric"><span class="badge ${diff>0?'badge-danger':diff<0?'badge-success':'badge-info'}">${diff>0?'+':''}${money(diff)}</span></td><td>${esc(String(val(x,'last_purchase_date','latest_date','bill_date','updated_at')||'—').slice(0,10))}</td></tr>`}).join(''):'<tr><td colspan="7" class="empty-row">No price records found.</td></tr>'}
async function load(){let r=await sb.from('supply_purchase_summary').select('*').limit(1000);if(r.error){console.warn('Price summary unavailable, using supply fallback.',r.error);r=await sb.from('supply').select('*').eq('is_active',true).order('Name')}if(r.error)throw r.error;rows=r.data||[]}
async function show(session){$('#auth').hidden=true;$('#app').hidden=false;const r=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();role=String(r.data?.role||'viewer').toLowerCase();setAccount({role,email:session.user.email||''});wireMasterShell({active:'Prices',role,logout:async()=>{await sb.auth.signOut();showLogin()}});await load();render()}
$('#login').onsubmit=async e=>{e.preventDefault();const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#err').textContent=error.message;$('#err').hidden=false}else await show(data.session)};
const{data:{session}}=await sb.auth.getSession();if(session)await show(session);else showLogin();sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT')showLogin();if(event==='SIGNED_IN'&&session)await show(session)});
</script></body></html>
