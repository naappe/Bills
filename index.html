<html lang="en">
<head>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="./app/css/system.css?v=5.1.5">

  <link rel="stylesheet" href="./app/css/bills-mobile.css?v=5.1.5-bills2">
  <style>
    .auth-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:#f4f7fb}
    .auth-loader-card{width:min(360px,100%);display:grid;justify-items:center;gap:14px;padding:34px 28px;text-align:center}
    .auth-loader-mark{width:58px;height:58px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(135deg,#e8bc55,#f6dc93);color:#102b4e;font:800 18px/1 system-ui}
    .auth-loader-spinner{width:34px;height:34px;border:3px solid rgba(26,60,110,.14);border-top-color:#1a3c6e;border-radius:50%;animation:auth-spin .8s linear infinite}
    @keyframes auth-spin{to{transform:rotate(360deg)}}
    .sidebar-backdrop{position:fixed;inset:0;z-index:50;background:rgba(8,25,47,.48);opacity:0;pointer-events:none}
    .sidebar-backdrop.visible{opacity:1;pointer-events:auto}
    .sidebar-head-actions{margin-left:auto;display:flex;gap:6px}
    .sidebar-icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(255,255,255,.08);color:#fff}
    .sidebar-close{display:none}
    datalist{display:none!important}
    @media(max-width:820px){#collapseSidebar{display:none}.sidebar-close{display:grid}}
  </style>
  <script>
    window.__BILLS_DEPLOYMENT__={version:'5.1.5',loadedAt:new Date().toISOString()};
    window.addEventListener('error',event=>console.error('[startup]',{message:event.error?.message||event.message||'Unknown startup error',file:event.filename,line:event.lineno,column:event.colno}));
    window.addEventListener('unhandledrejection',event=>console.error('[startup promise rejection]',event.reason));
    const closeSearchableMenu=input=>{
      const menu=input?.closest('.searchable-list-wrap')?.querySelector('.searchable-list-menu');
      if(!menu)return;
      menu.classList.remove('open');
      menu.replaceChildren();
    };
    document.addEventListener('change',event=>{
      if(event.target.matches?.('input[data-searchable-list]')){
        closeSearchableMenu(event.target);
        requestAnimationFrame(()=>closeSearchableMenu(event.target));
      }
    },true);
    document.addEventListener('mousedown',event=>{
      const option=event.target.closest?.('.searchable-list-option');
      if(!option)return;
      const input=option.closest('.searchable-list-wrap')?.querySelector('input[data-searchable-list]');
      requestAnimationFrame(()=>closeSearchableMenu(input));
    },true);
  </script>
</head>
<body class="auth-pending">
  <section class="auth-loader" id="authLoader" aria-live="polite" aria-busy="true"><div class="auth-loader-card"><div class="auth-loader-mark">WS</div><div class="auth-loader-spinner" aria-hidden="true"></div><h1>White Saffron Procurement</h1><p data-auth-message>Checking your secure session…</p></div></section>
  <section class="login hidden" id="loginView"><div class="login-card"><div class="login-mark">WS</div><h1>Procurement ERP</h1><p>Secure supplier bills, products, pricing and reports.</p><form class="stack" id="loginForm" method="post"><label>Username<input id="loginName" name="username" autocomplete="username" required></label><label>Password<input id="loginPassword" name="password" type="password" autocomplete="current-password" required></label><button class="btn" type="submit">Sign in</button><div id="loginNotice" aria-live="polite"></div></form></div></section>
  <section class="app hidden" id="appView">
    <aside class="sidebar" id="sidebar" aria-label="Application navigation"><div class="brand"><div class="brand-mark">WS</div><div><strong>White Saffron</strong><small>Procurement ERP</small></div><div class="sidebar-head-actions"><button class="sidebar-icon-btn" id="collapseSidebar" type="button" aria-label="Collapse sidebar" aria-pressed="false"><i class="fa-solid fa-angles-left" aria-hidden="true"></i></button><button class="sidebar-icon-btn sidebar-close" id="sidebarClose" type="button" aria-label="Close navigation"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div></div><nav class="nav" id="nav" aria-label="Primary navigation"></nav><div class="side-foot"><div class="side-account"><div class="side-avatar" id="sideAvatar">A</div><div class="side-account-copy"><strong id="sideEmail">Signed in</strong><small id="sideRole">STAFF</small></div></div><button class="btn secondary" id="logoutBtn" type="button" style="width:100%"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i><span>Sign out</span></button></div></aside>
    <button class="sidebar-backdrop hidden" id="sidebarBackdrop" type="button" aria-label="Close navigation"></button>
    <main class="main"><header class="topbar"><div class="top-left"><button class="btn secondary menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"><i class="fa-solid fa-bars" aria-hidden="true"></i></button><div class="top-title"><strong id="topTitle">Dashboard</strong><small id="topSubtitle">Procurement performance overview</small></div></div><div class="user"><div class="user-copy"><strong id="roleLabel">STAFF</strong><small id="emailLabel">Signed in</small></div><div class="avatar" id="avatar">A</div></div></header><div class="content" id="content"></div><footer class="app-footer"><div><span>White Saffron Procurement ERP</span><span>Secure MVR workspace · © <span id="footerYear"></span></span></div></footer></main>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8" crossorigin="anonymous"></script>
  <script type="module" src="./app/js/main.js?v=5.1.5-dropdown3"></script>
</body>
</html>
