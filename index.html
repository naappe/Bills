<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#34452f"><title>White Saffron Procurement ERP</title><link rel="stylesheet" href="./app/css/erp-v9.css?v=9.0.0"></head>
<body>
<section class="login" id="auth"><form class="login-card" id="loginForm"><div class="brand"><div class="mark">WS</div><div><strong>White Saffron</strong><small>Procurement & Cost Control</small></div></div><h1>Welcome back</h1><p>Sign in to manage purchasing, suppliers, inventory and reporting.</p><label><span>Email</span><input id="email" type="email" autocomplete="username" required></label><label><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" id="loginButton">Sign in</button><div class="alert danger hidden" id="loginError"></div></form></section>
<section class="app-shell hidden" id="erp"><header class="topbar"><div class="brand"><div class="mark">WS</div><div><strong>White Saffron</strong><small>Procurement & Cost Control</small></div></div><span class="hidden" id="pageTitle">Dashboard</span><div></div><div class="topbar-actions"><button class="btn menu-button" id="menuButton" type="button">Menu</button><div class="account"><strong id="accountName"></strong><small id="accountRole"></small></div><button class="btn" id="logout" type="button">Sign out</button></div></header><div class="layout"><aside class="sidebar" id="drawer"><div class="nav-group">Workspace</div><button data-route="dashboard">Dashboard</button><button data-route="products">Products</button><button data-route="stock">Inventory Control</button><button data-route="suppliers">Suppliers</button><button data-route="bills">Purchase Invoices</button><button data-route="prices">Price Analysis</button><button data-route="reports">Reports</button><div class="nav-group">Governance</div><button data-route="approvals">Approvals & Recovery</button><button data-route="admin">Administration</button><button data-route="settings">Settings</button></aside><main class="workspace" id="workspace"></main></div></section>
<section class="modal hidden" id="modal" role="dialog" aria-modal="true"><article class="dialog"><header class="dialog-head"><h2 id="modalTitle">Dialog</h2><button class="icon-btn" id="modalClose" type="button">Close</button></header><div class="dialog-body" id="modalBody"></div></article></section><div id="toasts" aria-live="polite"></div><script type="module" src="./app/js/erp-v9.js?v=9.0.0"></script></body></html>
