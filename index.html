<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1A3C6E">
  <meta name="app-version" content="4.9.9">
  <title>White Saffron Procurement ERP</title>
  <script>
    window.__BILLS_DEPLOYMENT__={version:'4.9.9',loadedAt:new Date().toISOString()};
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(registrations=>registrations.forEach(registration=>registration.unregister())).catch(()=>{});}
    if('caches' in window){caches.keys().then(keys=>Promise.all(keys.filter(key=>/bills|white|saffron|procurement|static/i.test(key)).map(key=>caches.delete(key)))).catch(()=>{});}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="app/css/app.css?v=4.9.9">
  <link rel="stylesheet" href="app/css/products.css?v=4.9.9">
  <link rel="stylesheet" href="app/css/vendors.css?v=4.9.9">
  <link rel="stylesheet" href="app/css/rates.css?v=4.9.9">
  <link rel="stylesheet" href="app/css/reports.css?v=4.9.9">
  <link rel="stylesheet" href="app/css/admin.css?v=4.9.9">
  <style>
    .date-toolbar,.bills-toolbar{display:grid;gap:var(--sp-2);padding:var(--sp-2);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)}
    .date-toolbar{grid-template-columns:220px 180px 180px minmax(240px,1fr);align-items:end}
    .bills-toolbar{grid-template-columns:minmax(300px,1.5fr) repeat(3,minmax(150px,.65fr));align-items:end}
    .date-toolbar label,.bills-toolbar label{gap:var(--sp-1)}
    .date-toolbar input,.date-toolbar select,.bills-toolbar input,.bills-toolbar select{background:var(--surface);transition:border-color var(--duration-fast),box-shadow var(--duration-fast),background var(--duration-fast)}
    .date-toolbar input:hover,.date-toolbar select:hover,.bills-toolbar input:hover,.bills-toolbar select:hover{border-color:var(--border-strong)}
    .bills-toolbar>input:first-child{padding-left:40px;background-image:linear-gradient(transparent,transparent);position:relative}
    .bills-toolbar .bill-custom{grid-column:span 1}
    .range-summary{min-height:var(--control-height);display:flex;align-items:flex-end;justify-content:center;flex-direction:column;padding:var(--sp-1) var(--sp-1-5);border-left:1px solid var(--border);background:var(--surface-muted);border-radius:var(--radius-control)}
    .range-summary span{color:var(--text-muted);font-size:var(--fs-11);text-transform:uppercase;letter-spacing:.04em;font-weight:var(--weight-bold)}
    .range-summary strong{color:var(--text-strong);font-size:var(--fs-13);font-variant-numeric:tabular-nums}
    .kpi.clickable{cursor:pointer;position:relative;transition:transform var(--duration-fast),box-shadow var(--duration-fast),border-color var(--duration-fast)}
    .kpi.clickable:hover,.kpi.clickable:focus{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--brand-gold);outline:0}
    .kpi.clickable:focus-visible{box-shadow:var(--shadow-focus),var(--shadow-md)}
    .kpi.clickable:after{content:'Open details →';margin-top:10px;color:var(--brand-navy);font:var(--weight-semibold) var(--fs-11)/1 var(--font-heading)}
    .grid-2>.card{height:100%}
    .grid-2>.card .card-head{background:var(--surface-muted)}
    .progress-row{min-height:34px}
    .track{height:10px}
    .bills-table{table-layout:auto}
    .bills-table th{top:0;background:var(--surface-muted)}
    .bills-table tbody tr:last-child td{border-bottom:0}
    .bills-table td:nth-child(1){min-width:120px}
    .bills-table td:nth-child(2){min-width:175px}
    .bills-table td:nth-child(3){min-width:210px}
    .bills-table td:nth-child(4){min-width:190px}
    .bills-table td:nth-child(5){min-width:130px}
    .bills-table td:nth-child(6){min-width:130px}
    .bills-table .action-col{min-width:150px}
    .bills-table td strong{color:var(--text-strong)}
    .pager{background:var(--surface-muted)}
    .pager>span{color:var(--text-muted);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
    @media(max-width:1180px){.date-toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.range-summary{border-left:0;grid-column:1/-1;align-items:flex-start}.bills-toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.bills-toolbar>input:first-child{grid-column:1/-1}}
    @media(max-width:820px){.date-toolbar,.bills-toolbar{grid-template-columns:1fr}.date-toolbar>*,.bills-toolbar>*{grid-column:1!important}.range-summary{align-items:flex-start}.kpi.clickable:after{display:none}.grid-2>.card .card-head{align-items:flex-start}.bills-table .action-col{min-width:130px}}
  </style>
  <!-- Loaded last: this owns the structure of every route. -->
  <link rel="stylesheet" href="app/css/system.css?v=4.9.9">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8"></script>
</head>
<body class="auth-pending">
  <section class="login" id="loginView">
    <div class="login-card">
      <div class="login-mark">WS</div>
      <h1>Procurement ERP</h1>
      <p>Secure supplier bills, products, pricing and reports.</p>
      <form class="stack" id="loginForm">
        <label>Username<input id="loginName" autocomplete="username" required></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Sign in</button>
        <div id="loginNotice"></div>
      </form>
    </div>
  </section>

  <section class="app hidden" id="appView">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">WS</div><div><strong>White Saffron</strong><small>Procurement ERP</small></div></div>
      <nav class="nav" id="nav" aria-label="Primary navigation"></nav>
      <div class="side-foot"><button class="btn secondary" id="logoutBtn" type="button" style="width:100%">Sign out</button></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-left"><button class="btn secondary menu-btn" id="menuBtn" type="button" aria-label="Open navigation"><i class="fa-solid fa-bars"></i></button><div class="top-title"><strong id="topTitle">Dashboard</strong><small id="topSubtitle">Procurement performance overview</small></div></div>
        <div class="user"><div class="user-copy"><strong id="roleLabel">STAFF</strong><small id="emailLabel">Signed in</small></div><div class="avatar" id="avatar">A</div></div>
      </header>
      <div class="content" id="content"></div>
      <footer class="app-footer"><div><span>White Saffron Procurement ERP</span><span>Secure MVR workspace · © <span id="footerYear"></span></span></div></footer>
    </main>
  </section>

  <script type="module" src="app/js/main.js?v=4.9.9"></script>
  <script type="module" src="app/js/search-fix.js?v=4.9.9"></script>
</body>
</html>
