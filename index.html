<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1A3C6E">
  <meta name="app-version" content="4.9.48">
  <title>White Saffron Procurement ERP</title>
  <script>
    window.__BILLS_DEPLOYMENT__={version:'4.9.48',loadedAt:new Date().toISOString()};
    if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(registrations=>registrations.forEach(registration=>registration.unregister())).catch(()=>{});}
    if('caches' in window){caches.keys().then(keys=>Promise.all(keys.filter(key=>/bills|white|saffron|procurement|static/i.test(key)).map(key=>caches.delete(key)))).catch(()=>{});}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="app/css/app.css?v=4.9.48">
  <link rel="stylesheet" href="app/css/products.css?v=4.9.48">
  <link rel="stylesheet" href="app/css/vendors.css?v=4.9.48">
  <link rel="stylesheet" href="app/css/rates.css?v=4.9.48">
  <link rel="stylesheet" href="app/css/reports.css?v=4.9.48">
  <link rel="stylesheet" href="app/css/admin.css?v=4.9.48">
  <link rel="stylesheet" href="app/css/system.css?v=4.9.48">
  <link rel="stylesheet" href="app/css/layout.css?v=4.9.48">
  <style>
    .auth-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 32%,rgba(230,184,73,.16),transparent 28%),#f4f7fb}.auth-loader-card{width:min(360px,100%);display:grid;justify-items:center;gap:14px;padding:34px 28px;text-align:center}.auth-loader-mark{width:58px;height:58px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(135deg,#e8bc55,#f6dc93);color:#102b4e;font:800 18px/1 system-ui,sans-serif;box-shadow:0 12px 30px rgba(16,43,78,.14)}.auth-loader-spinner{width:34px;height:34px;border:3px solid rgba(26,60,110,.14);border-top-color:#1a3c6e;border-radius:50%;animation:auth-spin .8s linear infinite}.auth-loader h1{margin:2px 0 0;color:#102b4e;font:700 20px/1.25 system-ui,sans-serif}.auth-loader p{margin:0;color:#66758a;font:500 13px/1.5 system-ui,sans-serif}@keyframes auth-spin{to{transform:rotate(360deg)}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8"></script>
</head>
<body class="auth-pending">
  <section class="auth-loader" id="authLoader" aria-live="polite" aria-busy="true">
    <div class="auth-loader-card">
      <div class="auth-loader-mark">WS</div>
      <div class="auth-loader-spinner" aria-hidden="true"></div>
      <h1>White Saffron Procurement</h1>
      <p data-auth-message>Checking your secure session…</p>
    </div>
  </section>
  <section class="login hidden" id="loginView">
    <div class="login-card">
      <div class="login-mark">WS</div>
      <h1>Procurement ERP</h1>
      <p>Secure supplier bills, products, pricing and reports.</p>
      <form class="stack" id="loginForm">
        <label>Username<input id="loginName" autocomplete="username" required></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Sign in</button>
        <div id="loginNotice"></div>
      </form>
    </div>
  </section>
  <section class="app hidden" id="appView">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">WS</div><div><strong>White Saffron</strong><small>Procurement ERP</small></div></div>
      <nav class="nav" id="nav" aria-label="Primary navigation"></nav>
      <div class="side-foot"><button class="btn secondary" id="logoutBtn" type="button" style="width:100%">Sign out</button></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-left"><button class="btn secondary menu-btn" id="menuBtn" type="button" aria-label="Open navigation"><i class="fa-solid fa-bars"></i></button><div class="top-title"><strong id="topTitle">Dashboard</strong><small id="topSubtitle">Procurement performance overview</small></div></div>
        <div class="user"><div class="user-copy"><strong id="roleLabel">STAFF</strong><small id="emailLabel">Signed in</small></div><div class="avatar" id="avatar">A</div></div>
      </header>
      <div class="content" id="content"></div>
      <footer class="app-footer"><div><span>White Saffron Procurement ERP</span><span>Secure MVR workspace · © <span id="footerYear"></span></span></div></footer>
    </main>
  </section>
  <script type="module" src="app/js/main.js?v=4.9.48"></script>
</body>
</html>
