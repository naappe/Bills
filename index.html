<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="app-version" content="2.2.1"><title>White Saffron ERP</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"><link rel="stylesheet" href="./app/css/master.css?v=2.2.1"><style>.head-actions,.row-actions{display:flex;gap:8px}.searchbox{position:relative;flex:1;min-width:260px}.searchbox input{padding-left:38px;padding-right:38px}.searchbox:before{content:'⌕';position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}.clear-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;min-height:30px;border:0;background:transparent;color:var(--muted);cursor:pointer}.tool-modern{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:16px}.tool-modern .field{min-width:160px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.modal-wide{width:min(880px,100%)}.preview{padding:14px;border:1px solid var(--border);border-radius:10px;background:var(--surface-muted);font-weight:700}.mobile-add{display:none}@media(max-width:980px){.head-actions{display:none}}@media(max-width:820px){.mobile-add{display:flex;margin-left:auto;gap:6px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.tool-modern>*{width:100%}.searchbox{min-width:100%}}</style></head><body>
<section class="auth-screen" id="authScreen"><form class="login-card" id="loginForm"><div class="master-mark login-mark">WS</div><div><h1>White Saffron ERP</h1><p>Sign in to manage bills and stock.</p></div><label class="field"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Password</span><input id="password" type="password" required></label><button class="btn btn-primary" id="loginBtn">Sign in</button><div class="alert alert-error" id="loginError" hidden></div></form></section>
<section class="master-app" id="app" hidden><header class="master-header"><div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div><nav class="master-nav" id="desktopNav"></nav><div class="head-actions"><button class="btn btn-secondary" id="topStock">＋ Stock</button><button class="btn btn-primary" id="topBill">＋ New Bill</button></div><div class="master-account"><div class="master-account-copy"><strong id="role">USER</strong><small id="userEmail"></small></div><div class="master-avatar" id="avatar">U</div><button class="icon-button" id="logout">↪</button></div></header><aside class="master-drawer" id="drawer"><div class="master-drawer-head"><div class="master-mark">WS</div><strong>Menu</strong><button class="icon-button" id="closeDrawer">×</button></div><div class="page-actions" style="padding:16px 0"><button class="btn btn-primary" id="drawerBill">＋ New Bill</button><button class="btn btn-secondary" id="drawerStock">＋ Stock</button></div><nav class="master-drawer-nav" id="mobileNav"></nav></aside><button class="master-backdrop" id="backdrop"></button><main class="master-main"><header class="master-mobilebar"><button class="icon-button" id="openDrawer">☰</button><strong id="mobileTitle">Dashboard</strong><div class="mobile-add"><button class="icon-button" id="mobileStock">＋S</button><button class="icon-button" id="mobileBill">＋B</button></div></header><div class="master-content" id="content"></div><footer class="master-footer"><div><span>Secure procurement workspace</span><span>© <span id="year"></span></span></div></footer></main></section>
<section class="modal-overlay" id="modal" hidden><article class="modal-dialog modal-wide"><header class="modal-header"><div><h2 id="modalTitle"></h2><p id="modalSub"></p></div><button class="icon-button" id="modalClose">×</button></header><div class="modal-body" id="modalBody"></div></article></section>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true}}),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>{let n=Number(String(v??'').replace(/[^0-9.-]/g,''));return Number.isFinite(n)?n:0},money=v=>`MVR ${num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const routes={dashboard:'Dashboard',bills:'Bills',products:'Supply',vendors:'Inventory',cost:'Cost',reports:'Reports',settings:'Settings',admin:'Admin'},S={session:null,role:'USER',bills:[],vendors:[],supply:[],bs:'',ss:''};
const bd=r=>r.bill_day||r.bill_date||r['Bill Date']||'',bv=r=>r.vendor||r.Vendor||'Unknown vendor',bn=r=>r.bill_no||r['Bill No']||`#${r.id}`,ba=r=>r.net_amount??r.amount??r.Amount??0,st=r=>r.payment_status||r.approval_status||'Recorded';
function badge(v){let s=String(v).toLowerCase(),t=s.includes('paid')||s.includes('stock')?'success':s.includes('pending')||s.includes('low')?'warning':'neutral';return`<span class="status-badge ${t}">${esc(v)}</span>`}
function nav(){let h=Object.entries(routes).map(([k,v])=>`<a href="#${k}" data-route="${k}">${v}</a>`).join('');$('#desktopNav').innerHTML=h;$('#mobileNav').innerHTML=h}
function drawer(x){$('#drawer').classList.toggle('open',x);$('#backdrop').classList.toggle('visible',x)}function showModal(title,sub,html){$('#modalTitle').textContent=title;$('#modalSub').textContent=sub;$('#modalBody').innerHTML=html;$('#modal').hidden=false;document.body.classList.add('modal-open')}function closeModal(){$('#modal').hidden=true;document.body.classList.remove('modal-open')}
async function base(force=false){if(force)S.bills=S.vendors=[];if(!S.vendors.length){let{data,error}=await supabase.from('vendors').select('*').is('deleted_at',null).order('name');if(error)throw error;S.vendors=data||[]}if(!S.bills.length){let{data,error}=await supabase.from('bills').select('*').is('deleted_at',null).is('archived_at',null).order('bill_day',{ascending:false}).limit(5000);if(error)throw error;S.bills=data||[]}}
async function stock(force=false){if(force)S.supply=[];if(!S.supply.length){let{data,error}=await supabase.from('supply').select('*').eq('is_active',true).order('Name');if(error)throw error;S.supply=data||[]}}
const search=(id,val,ph)=>`<div class="searchbox"><input id="${id}" value="${esc(val)}" placeholder="${ph}"><button class="clear-x" data-clear="${id}">×</button></div>`;
function bindClear(){$$('[data-clear]').forEach(b=>b.onclick=()=>{let i=$('#'+b.dataset.clear);i.value='';i.focus()})}
async function dashboard(){await base();await stock();$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Dashboard</h1><p>Procurement and stock overview.</p></div><div class="page-actions"><button class="btn btn-secondary" id="dStock">＋ Receive Stock</button><button class="btn btn-primary" id="dBill">＋ New Bill</button></div></header><section class="kpi-grid"><article class="card kpi-card"><span>Bills</span><strong>${S.bills.length}</strong></article><article class="card kpi-card"><span>Total spend</span><strong>${money(S.bills.reduce((a,r)=>a+num(ba(r)),0))}</strong></article><article class="card kpi-card"><span>Supply items</span><strong>${S.supply.length}</strong></article><article class="card kpi-card"><span>Low stock</span><strong>${S.supply.filter(r=>num(r.stock)<=num(r.minimum_stock)).length}</strong></article></section></section>`;$('#dBill').onclick=billForm;$('#dStock').onclick=()=>stockForm()}
async function bills(){await base();let q=S.bs.toLowerCase(),rows=S.bills.filter(r=>!q||[bv(r),bn(r),r.category].some(x=>String(x||'').toLowerCase().includes(q)));$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Bills</h1><p>Each row is one bill. A vendor can appear more than once because it has multiple bills.</p></div><div class="page-actions"><button class="btn btn-secondary" id="bRefresh">Refresh</button><button class="btn btn-primary" id="bAdd">＋ New Bill</button></div></header><section class="kpi-grid"><article class="card kpi-card"><span>Total bills</span><strong>${S.bills.length}</strong></article><article class="card kpi-card"><span>Matching bills</span><strong>${rows.length}</strong></article><article class="card kpi-card"><span>Matching amount</span><strong>${money(rows.reduce((a,r)=>a+num(ba(r)),0))}</strong></article><article class="card kpi-card"><span>Unique vendors</span><strong>${new Set(rows.map(r=>bv(r).toLowerCase())).size}</strong></article></section><section class="card tool-modern">${search('billSearch',S.bs,'Search vendor, bill number or category')}<div class="row-actions"><button class="btn btn-primary" id="bSearch">Search</button><button class="btn btn-secondary" id="bClear">Clear</button></div></section><section class="card"><header class="card-header"><h2>Bill register</h2><p>${rows.length} results</p></header><div class="table-wrapper"><table><thead><tr><th>Date</th><th>Vendor</th><th>Reference</th><th>Status</th><th class="numeric">Amount</th></tr></thead><tbody>${rows.slice(0,100).map(r=>`<tr><td>${esc(bd(r))}</td><td><strong>${esc(bv(r))}</strong><small>${esc(r.category||'Uncategorised')}</small></td><td>${esc(bn(r))}</td><td>${badge(st(r))}</td><td class="numeric"><strong>${money(ba(r))}</strong></td></tr>`).join('')}</tbody></table></div></section></section>`;bindClear();let go=()=>{S.bs=$('#billSearch').value.trim();bills()};$('#bSearch').onclick=go;$('#billSearch').onkeydown=e=>e.key==='Enter'&&go();$('#bClear').onclick=()=>{S.bs='';bills()};$('#bAdd').onclick=billForm;$('#bRefresh').onclick=async()=>{await base(true);bills()}}
async function supply(){await stock();let q=S.ss.toLowerCase(),rows=S.supply.filter(r=>!q||[r.Name,r.Vendor,r.Catogories].some(x=>String(x||'').toLowerCase().includes(q)));$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Supply</h1><p>Use Receive Stock beside an item or the main Stock button.</p></div><div class="page-actions"><button class="btn btn-secondary" id="sRefresh">Refresh</button><button class="btn btn-primary" id="sAdd">＋ Receive Stock</button></div></header><section class="card tool-modern">${search('stockSearch',S.ss,'Search item, vendor or category')}<div class="row-actions"><button class="btn btn-primary" id="sSearch">Search</button><button class="btn btn-secondary" id="sClear">Clear</button></div></section><section class="card"><div class="table-wrapper"><table><thead><tr><th>Item</th><th>Unit</th><th>Vendor</th><th class="numeric">Stock</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.Name||'Unnamed')}</strong></td><td>${esc(r.Unit||'—')}</td><td>${esc(r.Vendor||'—')}</td><td class="numeric"><strong>${num(r.stock)}</strong><small>Minimum ${num(r.minimum_stock)}</small></td><td>${badge(num(r.stock)<=num(r.minimum_stock)?'Low stock':'In stock')}</td><td><button class="btn ${num(r.stock)<=num(r.minimum_stock)?'btn-primary':'btn-secondary'} btn-small" data-stock="${r.id}">Receive Stock</button></td></tr>`).join('')}</tbody></table></div></section></section>`;bindClear();let go=()=>{S.ss=$('#stockSearch').value.trim();supply()};$('#sSearch').onclick=go;$('#stockSearch').onkeydown=e=>e.key==='Enter'&&go();$('#sClear').onclick=()=>{S.ss='';supply()};$('#sAdd').onclick=()=>stockForm();$('#sRefresh').onclick=async()=>{await stock(true);supply()};$$('[data-stock]').forEach(b=>b.onclick=()=>stockForm(+b.dataset.stock))}
async function inventory(){await base();$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Inventory</h1><p>Vendor master; names appear once here.</p></div></header><section class="card"><div class="table-wrapper"><table><thead><tr><th>Vendor</th><th>Phone</th><th>Email</th><th>TIN</th></tr></thead><tbody>${S.vendors.map(v=>`<tr><td><strong>${esc(v.name)}</strong></td><td>${esc(v.phone||'—')}</td><td>${esc(v.email||'—')}</td><td>${esc(v.tin||'—')}</td></tr>`).join('')}</tbody></table></div></section></section>`}
async function simple(name){$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>${name}</h1><p>This module is ready for the next polishing pass.</p></div></header></section>`}
async function billForm(){await base();showModal('New Bill','Enter and save a supplier bill.',`<form id="billForm"><div class="form-grid"><label class="field"><span>Date *</span><input id="bfDate" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="field"><span>Vendor *</span><select id="bfVendor" required><option value="">Select vendor</option>${S.vendors.filter(v=>v.is_active).map(v=>`<option value="${esc(v.name)}" data-id="${v.id}">${esc(v.name)}</option>`).join('')}</select></label><label class="field"><span>Bill number *</span><input id="bfNo" required></label><label class="field"><span>Amount *</span><input id="bfAmount" type="number" min="0" step="0.01" required></label><label class="field"><span>Category</span><input id="bfCat"></label><label class="field"><span>Status</span><select id="bfStatus"><option>Pending</option><option>Paid</option></select></label><label class="field full"><span>Notes</span><textarea id="bfNotes"></textarea></label></div><div class="alert alert-error" id="bfError" hidden></div><footer class="modal-footer"><button type="button" class="btn btn-secondary" id="bfCancel">Cancel</button><button class="btn btn-primary" id="bfSave">Save Bill</button></footer></form>`);$('#bfCancel').onclick=closeModal;$('#billForm').onsubmit=async e=>{e.preventDefault();let b=$('#bfSave'),v=$('#bfVendor'),a=num($('#bfAmount').value);b.disabled=true;let{error}=await supabase.from('bills').insert({bill_day:$('#bfDate').value,bill_date:$('#bfDate').value,vendor:v.value,vendor_id:v.selectedOptions[0]?.dataset.id||null,bill_no:$('#bfNo').value.trim(),amount:String(a),net_amount:a,currency:'MVR',category:$('#bfCat').value.trim()||null,payment_status:$('#bfStatus').value,notes:$('#bfNotes').value.trim()||null,approval_status:'draft',user_id:S.session.user.id});b.disabled=false;if(error){$('#bfError').textContent=error.message;$('#bfError').hidden=false;return}closeModal();await base(true);location.hash='#bills';bills()}}
async function stockForm(id=null){await stock();showModal('Receive Stock','Add received quantity to current stock.',`<form id="stockForm"><div class="form-grid"><label class="field full"><span>Item *</span><select id="sfItem" required><option value="">Select item</option>${S.supply.map(r=>`<option value="${r.id}" ${+r.id===+id?'selected':''}>${esc(r.Name||'Unnamed')}</option>`).join('')}</select></label><label class="field"><span>Quantity received *</span><input id="sfQty" type="number" min="0.0001" step="0.0001" required></label><label class="field"><span>Latest rate</span><input id="sfRate" type="number" min="0" step="0.01"></label><label class="field full"><span>Reference / note</span><input id="sfNote"></label><div class="preview full" id="sfPreview">Select an item.</div></div><div class="alert alert-error" id="sfError" hidden></div><footer class="modal-footer"><button type="button" class="btn btn-secondary" id="sfCancel">Cancel</button><button class="btn btn-primary" id="sfSave">Receive Stock</button></footer></form>`);let preview=()=>{let i=S.supply.find(r=>+r.id===+$('#sfItem').value),q=num($('#sfQty').value);$('#sfPreview').textContent=i?`Current ${num(i.stock)} ${i.Unit||''} + ${q} = ${num(i.stock)+q} ${i.Unit||''}`:'Select an item.';if(i&&!$('#sfRate').value)$('#sfRate').value=num(i.Rate)||''};$('#sfItem').onchange=preview;$('#sfQty').oninput=preview;$('#sfCancel').onclick=closeModal;preview();$('#stockForm').onsubmit=async e=>{e.preventDefault();let i=S.supply.find(r=>+r.id===+$('#sfItem').value),b=$('#sfSave');if(!i)return;b.disabled=true;let{error}=await supabase.from('supply').update({stock:num(i.stock)+num($('#sfQty').value),Rate:num($('#sfRate').value)||num(i.Rate),description:$('#sfNote').value.trim()||i.description,last_purchase_date:new Date().toISOString().slice(0,10)}).eq('id',i.id);b.disabled=false;if(error){$('#sfError').textContent=error.message;$('#sfError').hidden=false;return}closeModal();await stock(true);location.hash='#products';supply()}}
async function route(){let r=location.hash.slice(1)||'dashboard';$$('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===r));$('#mobileTitle').textContent=routes[r]||'Dashboard';drawer(false);try{if(r==='dashboard')await dashboard();else if(r==='bills')await bills();else if(r==='products')await supply();else if(r==='vendors')await inventory();else await simple(routes[r]||'Dashboard')}catch(e){console.error(e);$('#content').innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`}}
async function show(session){S.session=session;$('#authScreen').hidden=true;$('#app').hidden=false;let email=session.user.email||'';$('#userEmail').textContent=email;$('#avatar').textContent=email[0]?.toUpperCase()||'U';let{data}=await supabase.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();S.role=(data?.role||'user').toUpperCase();$('#role').textContent=S.role;nav();route()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginBtn').disabled=true;let{data,error}=await supabase.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});$('#loginBtn').disabled=false;if(error){$('#loginError').textContent=error.message;$('#loginError').hidden=false}else show(data.session)};$('#logout').onclick=()=>supabase.auth.signOut();$('#openDrawer').onclick=()=>drawer(true);$('#closeDrawer').onclick=()=>drawer(false);$('#backdrop').onclick=()=>drawer(false);$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>e.target===$('#modal')&&closeModal();[['topBill',billForm],['drawerBill',billForm],['mobileBill',billForm],['topStock',()=>stockForm()],['drawerStock',()=>stockForm()],['mobileStock',()=>stockForm()]].forEach(([id,f])=>$('#'+id).onclick=f);window.onhashchange=route;$('#year').textContent=new Date().getFullYear();let{data:{session}}=await supabase.auth.getSession();session?show(session):($('#authScreen').hidden=false);supabase.auth.onAuthStateChange((_e,s)=>s?(!S.session&&show(s)):(S.session&&(S.session=null,$('#app').hidden=true,$('#authScreen').hidden=false)));
</script></body></html>
