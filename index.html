<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f63">
  <title>BusinessOS · White Saffron</title>
  <link rel="stylesheet" href="./app/css/erp-v9.css?v=9.0.1">
  <link rel="stylesheet" href="./app/css/businessos.css?v=0.2.1">
  <link rel="stylesheet" href="./app/css/businessos-procurement.css?v=0.2.1">
  <link rel="stylesheet" href="./app/css/businessos-receiving.css?v=0.3.0">
</head>
<body>
<section class="login" id="auth">
  <form class="login-card" id="loginForm">
    <div class="brand"><div class="mark">BOS</div><div><strong>BusinessOS</strong><small>White Saffron · Procurement v0.3</small></div></div>
    <h1>Welcome back</h1>
    <p>Sign in to manage purchasing, receiving, suppliers, inventory, approvals and business reporting.</p>
    <label><span>Email</span><input id="email" type="email" autocomplete="username" required></label>
    <label><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary" id="loginButton">Sign in</button>
    <div class="alert danger hidden" id="loginError"></div>
  </form>
</section>

<section class="app-shell hidden" id="erp">
  <header class="topbar">
    <div class="brand"><div class="mark">BOS</div><div><strong>BusinessOS</strong><small>White Saffron · Procurement v0.3</small></div></div>
    <span class="hidden" id="pageTitle">Management Dashboard</span>
    <div></div>
    <div class="topbar-actions">
      <button class="btn menu-button" id="menuButton" type="button">Menu</button>
      <div class="account"><strong id="accountName"></strong><small id="accountRole"></small></div>
      <button class="btn" id="logout" type="button">Sign out</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="drawer">
      <div class="nav-group">Workspace</div>
      <button data-route="dashboard">Management Dashboard</button>

      <div class="nav-group">Procurement</div>
      <button data-bos-procurement="requests">Purchase Requests</button>
      <button data-bos-procurement="orders">Purchase Orders</button>
      <button data-bos-receiving="receipts">Goods Receipts</button>
      <button data-route="bills">Purchase Invoices</button>
      <button data-route="suppliers">Supplier Management</button>
      <button data-route="products">Product Master</button>

      <div class="nav-group">Inventory & Cost</div>
      <button data-route="stock">Inventory Ledger</button>
      <button data-route="prices">Price Intelligence</button>

      <div class="nav-group">Control & Insight</div>
      <button data-route="reports">Reporting & Analytics</button>
      <button data-route="approvals">Approvals & Recovery</button>

      <div class="nav-group">System</div>
      <button data-route="admin">Administration</button>
      <button data-route="settings">Organisation Settings</button>
    </aside>
    <main class="workspace" id="workspace"></main>
  </div>
</section>

<section class="modal hidden" id="modal" role="dialog" aria-modal="true">
  <article class="dialog">
    <header class="dialog-head"><h2 id="modalTitle">Dialog</h2><button class="icon-btn" id="modalClose" type="button">Close</button></header>
    <div class="dialog-body" id="modalBody"></div>
  </article>
</section>
<div id="toasts" aria-live="polite"></div>
<script src="./app/js/businessos-startup.js?v=0.2.1"></script>
<script type="module" src="./app/js/erp-v9.js?v=9.0.1"></script>
<script defer src="./app/js/businessos-ui.js?v=0.3.0"></script>
<script type="module" src="./app/js/businessos-procurement.js?v=0.2.1"></script>
<script type="module" src="./app/js/businessos-receiving.js?v=0.3.0"></script>
</body>
</html>
