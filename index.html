<script type="module">

const NAV=[{route:'dashboard',label:'Dashboard',roles:['admin','manager','staff','viewer']},{route:'bills',label:'Bills',roles:['admin','manager','staff','viewer']},{route:'products',label:'Supply',roles:['admin','manager','staff','viewer']},{route:'vendors',label:'Inventory',roles:['admin','manager']},{route:'cost',label:'Cost',roles:['admin','manager']},{route:'reports',label:'Reports',roles:['admin','manager','viewer']},{route:'settings',label:'Settings',roles:['admin','manager','staff','viewer']},{route:'admin',label:'Admin',roles:['admin']}],S={session:null,role:'viewer',bills:[],vendors:[],supply:[],billSearch:'',supplySearch:'',draftItems:[]};

async function dashboard(){await Promise.all([loadBase(),loadSupply()]);$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Dashboard</h1><p>Procurement and stock overview for ${esc(S.role)}.</p></div><div class="page-actions">${canWrite()?'<button class="btn btn-secondary" data-new-stock>＋ Receive Stock</button><button class="btn btn-primary" data-new-bill>＋ New Bill</button>':''}</div></header><section class="kpi-grid"><article class="card kpi-card"><span>Bills</span><strong>${S.bills.length}</strong></article><article class="card kpi-card"><span>Total spend</span><strong>${money(S.bills.reduce((a,r)=>a+num(ba(r)),0))}</strong></article><article class="card kpi-card"><span>Supply items</span><strong>${S.supply.length}</strong></article><article class="card kpi-card"><span>Low stock</span><strong>${S.supply.filter(r=>num(r.stock)<=num(r.minimum_stock)).length}</strong></article></section></section>`;$$('[data-new-bill]').forEach(b=>b.onclick=openBillForm);$$('[data-new-stock]').forEach(b=>b.onclick=()=>openStockForm())}
async function bills(){await loadBase();const q=S.billSearch.toLowerCase(),rows=S.bills.filter(r=>!q||[bv(r),bn(r),r.category].some(x=>String(x||'').toLowerCase().includes(q)));$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Bills</h1><p>Each row is one bill. The same vendor can appear on multiple separate bills.</p></div><div class="page-actions"><button class="btn btn-secondary" id="refreshBills">Refresh</button>${canWrite()?'<button class="btn btn-primary" id="newBill">＋ New Bill</button>':''}</div></header><section class="kpi-grid"><article class="card kpi-card"><span>Total bills</span><strong>${S.bills.length}</strong></article><article class="card kpi-card"><span>Matching bills</span><strong>${rows.length}</strong></article><article class="card kpi-card"><span>Matching amount</span><strong>${money(rows.reduce((a,r)=>a+num(ba(r)),0))}</strong></article><article class="card kpi-card"><span>Unique vendors</span><strong>${new Set(rows.map(r=>bv(r).trim().toLowerCase())).size}</strong></article></section><section class="card modern-toolbar">${searchBox('billSearch',S.billSearch,'Search vendor, bill number or category')}<div class="row-actions"><button class="btn btn-primary" id="applyBillSearch">Search</button><button class="btn btn-secondary" id="clearBillSearch">Clear</button></div></section><section class="card"><header class="card-header"><div><h2>Bill register</h2><p>${rows.length} results</p></div></header><div class="table-wrapper"><table><thead><tr><th>Date</th><th>Vendor</th><th>Reference</th><th>Status</th><th class="numeric">Amount</th></tr></thead><tbody>${rows.slice(0,200).map(r=>`<tr><td>${esc(bd(r))}</td><td><strong>${esc(bv(r))}</strong><small>${esc(r.category||'Uncategorised')}</small></td><td>${esc(bn(r))}</td><td>${badge(r.payment_status||r.approval_status||'Recorded')}</td><td class="numeric"><strong>${money(ba(r))}</strong></td></tr>`).join('')}</tbody></table></div></section></section>`;bindSearchClear();const go=()=>{S.billSearch=$('#billSearch').value.trim();bills()};$('#applyBillSearch').onclick=go;$('#billSearch').onkeydown=e=>e.key==='Enter'&&go();$('#clearBillSearch').onclick=()=>{S.billSearch='';bills()};$('#refreshBills').onclick=async()=>{await loadBase(true);bills()};if($('#newBill'))$('#newBill').onclick=openBillForm}
async function supply(){await loadSupply();const q=S.supplySearch.toLowerCase(),rows=S.supply.filter(r=>!q||[r.Name,r.Vendor,r.Catogories].some(x=>String(x||'').toLowerCase().includes(q)));$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Supply</h1><p>Current stock, minimum levels and latest rates.</p></div><div class="page-actions"><button class="btn btn-secondary" id="refreshSupply">Refresh</button>${canWrite()?'<button class="btn btn-primary" id="receiveStock">＋ Receive Stock</button>':''}</div></header><section class="card modern-toolbar">${searchBox('supplySearch',S.supplySearch,'Search item, vendor or category')}<div class="row-actions"><button class="btn btn-primary" id="applySupplySearch">Search</button><button class="btn btn-secondary" id="clearSupplySearch">Clear</button></div></section><section class="card"><div class="table-wrapper"><table><thead><tr><th>Item</th><th>Unit</th><th>Vendor</th><th class="numeric">Stock</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${esc(r.Name||'Unnamed')}</strong></td><td>${esc(r.Unit||'—')}</td><td>${esc(r.Vendor||'—')}</td><td class="numeric"><strong>${num(r.stock)}</strong><small>Minimum ${num(r.minimum_stock)}</small></td><td>${badge(num(r.stock)<=num(r.minimum_stock)?'Low stock':'In stock')}</td><td>${canWrite()?`<button class="btn btn-small ${num(r.stock)<=num(r.minimum_stock)?'btn-primary':'btn-secondary'}" data-stock="${r.id}">Receive Stock</button>`:''}</td></tr>`).join('')}</tbody></table></div></section></section>`;bindSearchClear();const go=()=>{S.supplySearch=$('#supplySearch').value.trim();supply()};$('#applySupplySearch').onclick=go;$('#supplySearch').onkeydown=e=>e.key==='Enter'&&go();$('#clearSupplySearch').onclick=()=>{S.supplySearch='';supply()};$('#refreshSupply').onclick=async()=>{await loadSupply(true);supply()};if($('#receiveStock'))$('#receiveStock').onclick=()=>openStockForm();$$('[data-stock]').forEach(b=>b.onclick=()=>openStockForm(+b.dataset.stock))}
async function inventory(){await loadBase();$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>Inventory</h1><p>Vendor master. Each vendor appears once here.</p></div></header><section class="card"><div class="table-wrapper"><table><thead><tr><th>Vendor</th><th>Phone</th><th>Email</th><th>TIN</th></tr></thead><tbody>${S.vendors.map(v=>`<tr><td><strong>${esc(v.name)}</strong></td><td>${esc(v.phone||'—')}</td><td>${esc(v.email||'—')}</td><td>${esc(v.tin||'—')}</td></tr>`).join('')}</tbody></table></div></section></section>`}async function simple(name){$('#content').innerHTML=`<section class="page-shell"><header class="page-header"><div><h1>${esc(name)}</h1><p>This module is available for your role and ready for the next development pass.</p></div></header></section>`}function denied(){return`<section class="card" style="max-width:680px;margin:40px auto"><div class="card-body"><h1>Access restricted</h1><p>Your ${esc(S.role)} role does not have permission to open this module.</p><a class="btn btn-primary" href="#dashboard">Return to Dashboard</a></div></section>`}

async function openBillForm(){if(!canWrite())return;await Promise.all([loadBase(),loadSupply()]);S.draftItems=[emptyDraftItem()];openModal('New Bill','Add one or more item rows. Every item description is mandatory.',`<form id="billForm"><div class="form-grid"><label class="field"><span>Date *</span><input id="bfDate" type="date" required value="${new Date().toISOString().slice(0,10)}"></label><label class="field"><span>Vendor *</span><select id="bfVendor" required><option value="">Select vendor</option>${S.vendors.filter(v=>v.is_active).map(v=>`<option value="${v.id}" data-name="${esc(v.name)}">${esc(v.name)}</option>`).join('')}</select></label><label class="field"><span>Bill number *</span><input id="bfNo" required></label><label class="field"><span>Location</span><input id="bfLocation"></label><label class="field"><span>Category</span><input id="bfCategory"></label><label class="field"><span>Payment status</span><select id="bfStatus"><option>Pending</option><option>Paid</option></select></label><label class="field"><span>Payment method</span><select id="bfMethod"><option value="">Not specified</option><option>Cash</option><option>Bank Transfer</option><option>Credit</option><option>Card</option></select></label><label class="field"><span>Due date</span><input id="bfDue" type="date"></label><label class="field"><span>TIN</span><input id="bfTin"></label><label class="field full"><span>Notes</span><textarea id="bfNotes"></textarea></label></div><div class="card-header" style="padding-left:0;padding-right:0;margin-top:18px"><div><h2>Bill items</h2><p>Descriptions, quantities and rates are validated before saving.</p></div><button type="button" class="btn btn-secondary" id="addItem">＋ Add Item</button></div><div class="bill-items" id="billItems"></div><div class="totals"><div class="total-row"><span>Subtotal</span><strong id="tSubtotal">MVR 0.00</strong></div><div class="total-row"><span>GST</span><strong id="tGst">MVR 0.00</strong></div><div class="total-row net"><span>Net total</span><strong id="tNet">MVR 0.00</strong></div></div><div class="alert alert-error" id="bfError" hidden></div><footer class="modal-footer"><button type="button" class="btn btn-secondary" id="bfCancel">Cancel</button><button class="btn btn-primary" id="bfSave">Save Bill</button></footer></form>`);renderDraftItems();$('#addItem').onclick=()=>{S.draftItems.push(emptyDraftItem());renderDraftItems()};$('#bfCancel').onclick=closeModal;$('#billForm').onsubmit=saveBillTransaction}
function lineTotal(it){const sub=num(it.quantity)*num(it.unit_rate);return sub+(sub*num(it.gst_rate)/100)}function itemRow(it,i){return`<section class="bill-item" data-item-row="${i}"><div class="item-number">ITEM ${i+1}</div><div class="item-grid"><label class="field desc"><span>Description *</span><input data-field="description" data-index="${i}" value="${esc(it.description)}" required placeholder="Item description"></label><label class="field supply-select"><span>Supply item</span><select data-field="supply_id" data-index="${i}"><option value="">Create/match by description</option>${S.supply.map(s=>`<option value="${s.id}" ${String(it.supply_id)===String(s.id)?'selected':''}>${esc(s.Name)}</option>`).join('')}</select></label><label class="field"><span>Qty *</span><input data-field="quantity" data-index="${i}" type="number" min="0.0001" step="0.0001" value="${it.quantity}" required></label><label class="field"><span>Unit *</span><select data-field="unit" data-index="${i}">${['PCS','KG','G','L','ML','BTL','CTN','PKT','DOZ'].map(u=>`<option ${it.unit===u?'selected':''}>${u}</option>`).join('')}</select></label><label class="field"><span>Unit rate *</span><input data-field="unit_rate" data-index="${i}" type="number" min="0" step="0.01" value="${it.unit_rate}" required></label><label class="field"><span>GST %</span><input data-field="gst_rate" data-index="${i}" type="number" min="0" max="100" step="0.01" value="${it.gst_rate}"></label><label class="field"><span>Line total</span><input value="${money(lineTotal(it))}" readonly></label><div class="item-actions"><button type="button" class="danger-link" data-remove-item="${i}" ${S.draftItems.length===1?'disabled':''}>Remove</button></div></div></section>`}
function renderDraftItems(){$('#billItems').innerHTML=S.draftItems.map(itemRow).join('');$$('[data-field]').forEach(el=>{el.oninput=el.onchange=()=>{const i=+el.dataset.index;S.draftItems[i][el.dataset.field]=el.value;if(el.dataset.field==='supply_id'&&el.value){const s=S.supply.find(x=>String(x.id)===String(el.value));if(s&&!S.draftItems[i].description)S.draftItems[i].description=s.Name||'';if(s){S.draftItems[i].unit=s.Unit||'PCS';S.draftItems[i].unit_rate=num(s.Rate)}renderDraftItems()}else updateTotals()}});$$('[data-remove-item]').forEach(b=>b.onclick=()=>{if(S.draftItems.length>1){S.draftItems.splice(+b.dataset.removeItem,1);renderDraftItems()}});updateTotals()}
function updateTotals(){let sub=0,gst=0;S.draftItems.forEach(x=>{const s=num(x.quantity)*num(x.unit_rate);sub+=s;gst+=s*num(x.gst_rate)/100});$('#tSubtotal').textContent=money(sub);$('#tGst').textContent=money(gst);$('#tNet').textContent=money(sub+gst);$$('[data-item-row]').forEach((row,i)=>{const ro=row.querySelector('input[readonly]');if(ro)ro.value=money(lineTotal(S.draftItems[i]))})}
async function saveBillTransaction(e){e.preventDefault();const box=$('#bfError');box.hidden=true,items=S.draftItems.map((x,i)=>({description:String(x.description||'').trim(),supply_id:x.supply_id||null,quantity:num(x.quantity),unit:String(x.unit||'PCS').toUpperCase(),unit_rate:num(x.unit_rate),gst_rate:num(x.gst_rate),pack_format:x.pack_format||'',sort_order:i+1})),bad=items.findIndex(x=>!x.description||x.quantity<=0||x.unit_rate<0||x.gst_rate<0||x.gst_rate>100);if(bad>=0){box.textContent=`Item ${bad+1} is incomplete. Description, positive quantity, non-negative rate and valid GST are required.`;box.hidden=false;return}const vendor=$('#bfVendor').selectedOptions[0],bill={bill_day:$('#bfDate').value,vendor_id:$('#bfVendor').value,vendor:vendor?.dataset.name||'',bill_no:$('#bfNo').value.trim(),location:$('#bfLocation').value.trim(),category:$('#bfCategory').value.trim(),payment_status:$('#bfStatus').value,payment_method:$('#bfMethod').value,due_date:$('#bfDue').value,tin:$('#bfTin').value.trim(),notes:$('#bfNotes').value.trim(),currency:'MVR',approval_status:S.role==='staff'?'draft':'approved'};if(!bill.bill_no||!bill.vendor_id){box.textContent='Vendor and bill number are required.';box.hidden=false;return}const btn=$('#bfSave');btn.disabled=true;btn.textContent='Saving…';const{data,error}=await supabase.rpc('create_bill_transaction',{p_bill:bill,p_items:items});btn.disabled=false;btn.textContent='Save Bill';if(error){box.textContent=error.message;box.hidden=false;return}closeModal();await Promise.all([loadBase(true),loadSupply(true)]);location.hash='#bills';await bills();alert(`Bill #${data} saved with ${items.length} item${items.length===1?'':'s'}. Stock and cost history were updated in the same transaction.`)}
async function openStockForm(id=null){if(!canWrite())return;await loadSupply();openModal('Receive Stock','Manual stock receipt outside a bill.',`<form id="stockForm"><div class="form-grid"><label class="field full"><span>Item *</span><select id="sfItem" required><option value="">Select item</option>${S.supply.map(r=>`<option value="${r.id}" ${String(r.id)===String(id)?'selected':''}>${esc(r.Name)}</option>`).join('')}</select></label><label class="field"><span>Quantity received *</span><input id="sfQty" type="number" min="0.0001" step="0.0001" required></label><label class="field"><span>Latest rate</span><input id="sfRate" type="number" min="0" step="0.01"></label><label class="field full"><span>Reference / reason *</span><input id="sfReason" required></label><div class="status-note full" id="sfPreview">Select an item.</div></div><div class="alert alert-error" id="sfError" hidden></div><footer class="modal-footer"><button type="button" class="btn btn-secondary" id="sfCancel">Cancel</button><button class="btn btn-primary" id="sfSave">Receive Stock</button></footer></form>`);const preview=()=>{const item=S.supply.find(x=>String(x.id)===String($('#sfItem').value)),q=num($('#sfQty').value);$('#sfPreview').textContent=item?`Current ${num(item.stock)} ${item.Unit||''} + ${q} = ${num(item.stock)+q} ${item.Unit||''}`:'Select an item.';if(item&&!$('#sfRate').value)$('#sfRate').value=num(item.Rate)||''};$('#sfItem').onchange=preview;$('#sfQty').oninput=preview;$('#sfCancel').onclick=closeModal;preview();$('#stockForm').onsubmit=async e=>{e.preventDefault();const item=S.supply.find(x=>String(x.id)===String($('#sfItem').value));if(!item)return;const q=num($('#sfQty').value),next=num(item.stock)+q,btn=$('#sfSave');btn.disabled=true;const{error}=await supabase.from('supply').update({stock:next,Rate:num($('#sfRate').value)||num(item.Rate),description:$('#sfReason').value.trim(),last_purchase_date:new Date().toISOString().slice(0,10)}).eq('id',item.id);btn.disabled=false;if(error){$('#sfError').textContent=error.message;$('#sfError').hidden=false;return}closeModal();await loadSupply(true);location.hash='#products';supply()}}
async function route(){let r=(location.hash.slice(1)||'dashboard').toLowerCase();if(!NAV.some(x=>x.route===r))r='dashboard';$$('[data-route]').forEach(a=>a.classList.toggle('active',a.dataset.route===r));$('#mobileTitle').textContent=NAV.find(x=>x.route===r)?.label||'Dashboard';drawer(false);if(!can(r)){$('#content').innerHTML=denied();return}try{if(r==='dashboard')await dashboard();else if(r==='bills')await bills();else if(r==='products')await supply();else if(r==='vendors')await inventory();else await simple(NAV.find(x=>x.route===r)?.label||'Dashboard')}catch(e){console.error(e);$('#content').innerHTML=`<div class="alert alert-error">${esc(e.message)}</div>`}}
async function show(session){S.session=session;$('#authScreen').hidden=true;$('#app').hidden=false;const email=session.user.email||'';$('#userEmail').textContent=email;$('#avatar').textContent=email[0]?.toUpperCase()||'U';const{data,error}=await supabase.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();if(error)console.error(error);S.role=String(data?.role||'viewer').toLowerCase();$('#role').textContent=S.role.toUpperCase();nav();if(!can(location.hash.slice(1)||'dashboard'))location.hash='#dashboard';await route()}function showLogin(){S.session=null;$('#app').hidden=true;$('#authScreen').hidden=false}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const b=$('#loginBtn');b.disabled=true;$('#loginError').hidden=true;const{data,error}=await supabase.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});b.disabled=false;if(error){$('#loginError').textContent=error.message;$('#loginError').hidden=false}else await show(data.session)};$('#logout').onclick=()=>supabase.auth.signOut();$('#openDrawer').onclick=()=>drawer(true);$('#closeDrawer').onclick=()=>drawer(false);$('#backdrop').onclick=()=>drawer(false);$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>e.target===$('#modal')&&closeModal();document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();drawer(false)}});window.onhashchange=route;$('#year').textContent=new Date().getFullYear();const{data:{session}}=await supabase.auth.getSession();session?await show(session):showLogin();supabase.auth.onAuthStateChange((_e,s)=>s?(!S.session&&show(s)):(S.session&&showLogin()));
</script></body></html>
