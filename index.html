  <style>
    .auth-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:#f4f7fb;opacity:1;visibility:visible;transform:scale(1);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1),visibility 0s linear .7s;will-change:opacity,transform}
    .auth-loader.leaving{opacity:0;visibility:hidden;transform:scale(1.025);pointer-events:none}
    .auth-loader-card{width:min(320px,100%);display:grid;justify-items:center;gap:12px;padding:28px 24px;text-align:center;transition:transform .7s cubic-bezier(.22,1,.36,1),opacity .45s ease}
    .auth-loader.leaving .auth-loader-card{transform:translateY(-10px) scale(.97);opacity:0}
    .auth-loader-mark{width:52px;height:52px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#e8bc55,#f6dc93);color:#102b4e;font:800 17px/1 system-ui}
    .auth-loader-title{margin:2px 0 0;color:#102b4e;font-size:20px;line-height:1.25;font-weight:700;letter-spacing:-.02em}
    .auth-loader-location{margin:-5px 0 0;color:#6b7b90;font-size:12px;line-height:1.4;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
    .auth-loader-signature{position:absolute;left:50%;bottom:max(30px,env(safe-area-inset-bottom));transform:translateX(-50%);margin:0;color:#7b8797;font:italic 14px/1.2 "Segoe Script","Brush Script MT",cursive;white-space:nowrap;transition:opacity .35s ease,transform .7s cubic-bezier(.22,1,.36,1)}
    .auth-loader.leaving .auth-loader-signature{opacity:0;transform:translate(-50%,8px)}
    .auth-loader-signature span{font-size:11px;font-family:Inter,system-ui,sans-serif;font-style:normal;letter-spacing:.04em;color:#9aa5b3}
    .auth-dot-loader{position:relative;width:30px;height:30px;margin:4px 0 2px}
    .auth-dot-loader span{position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#1a3c6e;transform:rotate(calc(var(--i)*45deg)) translateY(-12px);opacity:.16;animation:auth-dot-snake .9s linear infinite;animation-delay:calc(var(--i)*-.1125s)}
    @keyframes auth-dot-snake{0%,100%{opacity:.16;transform:rotate(calc(var(--i)*45deg)) translateY(-12px) scale(.75)}35%{opacity:1;transform:rotate(calc(var(--i)*45deg)) translateY(-12px) scale(1.15)}65%{opacity:.4;transform:rotate(calc(var(--i)*45deg)) translateY(-12px) scale(.9)}}
    @media(prefers-reduced-motion:reduce){.auth-loader,.auth-loader-card,.auth-loader-signature{transition-duration:.2s}.auth-dot-loader span{animation-duration:1.8s}}
    .sidebar-backdrop{position:fixed;inset:0;z-index:50;background:rgba(8,25,47,.48);opacity:0;pointer-events:none}
    .sidebar-backdrop.visible{opacity:1;pointer-events:auto}
    .sidebar-head-actions{margin-left:auto;display:flex;gap:6px}
    .sidebar-icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(255,255,255,.08);color:#fff}
    .sidebar-close{display:none}
    datalist{display:none!important}
    @media(max-width:820px){#collapseSidebar{display:none}.sidebar-close{display:grid}}
  </style>
  <script>
    window.__BILLS_DEPLOYMENT__={version:'5.1.8',loadedAt:new Date().toISOString()};
    window.addEventListener('error',event=>console.error('[startup]',{message:event.error?.message||event.message||'Unknown startup error',file:event.filename,line:event.lineno,column:event.colno}));
    window.addEventListener('unhandledrejection',event=>console.error('[startup promise rejection]',event.reason));
    const closeSearchableMenu=input=>{
      const menu=input?.closest('.searchable-list-wrap')?.querySelector('.searchable-list-menu');
      if(!menu)return;
      menu.classList.remove('open');
      menu.replaceChildren();
    };
    document.addEventListener('change',event=>{
      if(event.target.matches?.('input[data-searchable-list]')){
        closeSearchableMenu(event.target);
        requestAnimationFrame(()=>closeSearchableMenu(event.target));
      }
    },true);
    document.addEventListener('mousedown',event=>{
      const option=event.target.closest?.('.searchable-list-option');
      if(!option)return;
      const input=option.closest('.searchable-list-wrap')?.querySelector('input[data-searchable-list]');
      requestAnimationFrame(()=>closeSearchableMenu(input));
    },true);
  </script>

  <script>
    (()=>{
      const loader=document.getElementById('authLoader');
      if(!loader)return;
      const minimumVisibleUntil=performance.now()+3000;
      let releaseStarted=false;
      const observer=new MutationObserver(()=>{
        if(releaseStarted||!loader.classList.contains('hidden'))return;
        releaseStarted=true;
        loader.classList.remove('hidden');
        const wait=Math.max(0,minimumVisibleUntil-performance.now());
        window.setTimeout(()=>{
          loader.classList.add('leaving');
          window.setTimeout(()=>{
            loader.classList.add('hidden');
            loader.setAttribute('aria-busy','false');
            observer.disconnect();
          },720);
        },wait);
      });
      observer.observe(loader,{attributes:true,attributeFilter:['class']});
    })();
  </script>
