<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vendors · White Saffron ERP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700;900&family=Playfair+Display:wght@600;700;800&display=swap">
<link rel="stylesheet" href="./app/css/master.css?v=7.3.0"><link rel="stylesheet" href="./app/css/brand-ui.css?v=7.3.0">
<style>.vendor-shell{display:grid;gap:18px}.toolbar{display:grid;grid-template-columns:minmax(260px,1fr) 220px;gap:10px}.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.summary-card{padding:18px}.summary-card span{display:block;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.summary-card strong{display:block;margin-top:8px;font:700 26px/1.1 "Playfair Display",serif}.numeric{text-align:right}@media(max-width:820px){.toolbar,.summary-grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.toolbar,.summary-grid{grid-template-columns:1fr}}</style>
</head><body>
<section class="auth-screen" id="auth"><form class="login-card" id="login"><div class="master-mark login-mark">WS</div><div><h1>White Saffron ERP</h1><p>Sign in to review vendors.</p></div><label class="field"><span>Email</span><input id="email" type="email" required></label><label class="field"><span>Password</span><input id="password" type="password" required></label><button class="btn btn-primary">Sign in</button><div class="alert alert-error" id="err" hidden></div></form></section>
<section class="master-app" id="app" hidden><header class="master-header"><div class="master-brand"><div class="master-mark">WS</div><div class="master-brand-copy"><strong>White Saffron</strong><small>Procurement ERP</small></div></div><nav class="master-nav" id="desktopNav"></nav><div class="master-account"><div class="master-account-copy"><strong id="role"></strong><small id="user"></small></div><button class="icon-button" id="logout"></button></div></header><header class="mobile-top"><button id="openMenu"></button><strong>Vendors</strong><a class="btn btn-primary" href="./bills-live.html">New Bill</a></header><aside class="mobile-drawer" id="drawer"><div class="drawer-head"><div class="master-brand"><div class="master-mark">WS</div><strong>Menu</strong></div><button id="closeMenu">×</button></div><nav class="drawer-links" id="drawerNav"></nav></aside><button class="mobile-backdrop" id="backdrop"></button><main class="master-main"><div class="master-content" id="content"></div></main><nav class="mobile-bottom" id="bottomNav"></nav></section>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{wireMasterShell,setAccount}from'./app/js/master-shell.js?v=7.3.0';
const sb=createClient('https://tmupbruwmwlrmewhoodn.supabase.co','sb_publishable_LAn1liS2zqMqlB33IQJxIw_NbgWKix1',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'white-saffron-erp-auth'}});
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c])),num=v=>Number(v)||0,money=v=>`MVR ${num(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}`;let role='viewer',rows=[];
function showLogin(){$('#app').hidden=true;$('#auth').hidden=false}
function value(x,...keys){for(const k of keys)if(x?.[k]!==undefined&&x?.[k]!==null)return x[k];return''}
function render(){const active=rows.filter(v=>value(v,'is_active')!==false),withPhone=rows.filter(v=>value(v,'phone','mobile')),spend=rows.reduce((a,v)=>a+num(value(v,'total_purchases','purchase_total','total_value')),0);$('#content').innerHTML=`<section class="vendor-shell"><header class="dashboard-hero"><div><div class="hero-kicker">02 Vendor master</div><h1>Vendors</h1><p>Review supplier contacts, purchase activity and latest transaction details.</p></div></header><section class="summary-grid"><article class="card summary-card"><span>Total vendors</span><strong>${rows.length}</strong></article><article class="card summary-card"><span>Active</span><strong>${active.length}</strong></article><article class="card summary-card"><span>With phone</span><strong>${withPhone.length}</strong></article><article class="card summary-card"><span>Purchase value</span><strong>${money(spend)}</strong></article></section><section class="card toolbar"><label class="field"><span>Search</span><input id="q" placeholder="Search vendor, phone or TIN"></label><label class="field"><span>Status</span><select id="status"><option value="">All</option><option value="active">Active</option><option value="inactive">Inactive</option></select></label></section><section class="card"><div class="table-wrapper"><table><thead><tr><th>Vendor</th><th>TIN</th><th>Phone</th><th>Email</th><th>Last purchase</th><th class="numeric">Total purchases</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></section>`;['q','status'].forEach(id=>$(`#${id}`).oninput=draw);draw()}
function draw(){const q=($('#q').value||'').toLowerCase(),status=$('#status').value;const filtered=rows.filter(v=>{const active=value(v,'is_active')!==false,text=[value(v,'name','vendor_name','Vendor'),value(v,'tin','TIN'),value(v,'phone','mobile'),value(v,'email')].join(' ').toLowerCase();return(!q||text.includes(q))&&(!status||(status==='active'&&active)||(status==='inactive'&&!active))});$('#rows').innerHTML=filtered.length?filtered.map(v=>{const active=value(v,'is_active')!==false;return`<tr><td><strong>${esc(value(v,'name','vendor_name','Vendor')||'Unnamed vendor')}</strong></td><td>${esc(value(v,'tin','TIN')||'—')}</td><td>${esc(value(v,'phone','mobile')||'—')}</td><td>${esc(value(v,'email')||'—')}</td><td>${esc(String(value(v,'last_purchase','last_purchase_date','updated_at')||'—').slice(0,10))}</td><td class="numeric">${money(value(v,'total_purchases','purchase_total','total_value'))}</td><td><span class="badge ${active?'badge-success':'badge-info'}">${active?'Active':'Inactive'}</span></td></tr>`}).join(''):'<tr><td colspan="7" class="empty-row">No vendors found.</td></tr>'}
async function load(){let r=await sb.from('vendors').select('*').order('name');if(r.error){r=await sb.from('bills').select('vendor,Vendor,bill_day,bill_date,net_amount,amount,Amount').limit(1000);if(r.error)throw r.error;const map=new Map();for(const b of r.data||[]){const name=value(b,'vendor','Vendor')||'Unknown vendor',old=map.get(name)||{name,total_purchases:0,last_purchase:''};old.total_purchases+=num(value(b,'net_amount','amount','Amount'));const d=String(value(b,'bill_day','bill_date')||'');if(d>old.last_purchase)old.last_purchase=d;map.set(name,old)}rows=[...map.values()];return}rows=r.data||[]}
async function show(session){$('#auth').hidden=true;$('#app').hidden=false;const r=await sb.from('user_roles').select('role').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();role=String(r.data?.role||'viewer').toLowerCase();setAccount({role,email:session.user.email||''});wireMasterShell({active:'Vendors',role,logout:async()=>{await sb.auth.signOut();showLogin()}});try{await load();render()}catch(error){$('#content').innerHTML=`<section class="card fatal"><h2>Unable to load vendors</h2><p>${esc(error.message||error)}</p></section>`}}
$('#login').onsubmit=async e=>{e.preventDefault();const{data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#password').value});if(error){$('#err').textContent=error.message;$('#err').hidden=false}else await show(data.session)};const{data:{session}}=await sb.auth.getSession();if(session)await show(session);else showLogin();sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_OUT')showLogin();if(event==='SIGNED_IN'&&session)await show(session)});
</script></body></html>
